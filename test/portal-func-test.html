<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Functional Tests</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
</head>
<body>
<div id="testResult">RUNNING</div>
<pre id="testLog"></pre>
<script>
/* اختبار وظيفي للبوابة: backend حقيقي (Worker + SQLite) + واجهة portal الحقيقية.
   يقود المصمم فعليًا عبر UI والخطاف التشخيصي: جلسة، فرش، مشب، كمية، إنهاء. */
window.TEST_ERRORS = [];
window.addEventListener('error', function (e) { window.TEST_ERRORS.push('onerror: ' + (e.message || e.type)); });
window.addEventListener('unhandledrejection', function (e) { window.TEST_ERRORS.push('rejection: ' + ((e.reason && (e.reason.message || e.reason)) || e.type)); });
(function () {
  var log = function (m) { document.getElementById('testLog').textContent += m + '\n'; };
  var n = 0, bad = 0;
  var t = function (name, cond, why) {
    n++; if (cond) log('PASS F' + n + ' ' + name);
    else { bad++; log('FAIL F' + n + ' ' + name + (why ? ' :: ' + why : '')); }
  };
  var waitFor = function (cond, ms) {
    ms = ms || 120000; var t0 = Date.now();
    return new Promise(function (res, rej) {
      (function poll() {
        var v = null; try { v = cond(); } catch (e) { /* retry */ }
        if (v) return res(v);
        if (Date.now() - t0 > ms) return rej(new Error('timeout'));
        setTimeout(poll, 100);
      })();
    });
  };
  var realFetch = window.fetch.bind(window);

  (async function run() {
    try {
      var SQL = await initSqlJs({ locateFile: function (f) { return 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/' + f; } });
      var sqlite = new SQL.Database();
      sqlite.exec(await (await realFetch('../worker/schema.sql')).text());
      sqlite.run("UPDATE settings SET data = '{\"shopName\":\"أصالة نجد\",\"phone\":\"0512345678\",\"currency\":\"ر.س\"}' WHERE id = 1");
      var norm = function (v) { return v === undefined ? null : (typeof v === 'boolean' ? (v ? 1 : 0) : v); };
      var DB = {
        prepare: function (sql) {
          var st = { sql: sql, args: [] };
          st.bind = function () { st.args = Array.prototype.map.call(arguments, norm); return st; };
          st.first = async function () { var s = sqlite.prepare(sql); s.bind(st.args); var has = s.step(); var row = has ? s.getAsObject() : null; s.free(); return row; };
          st.all = async function () { var s = sqlite.prepare(sql); s.bind(st.args); var results = []; while (s.step()) results.push(s.getAsObject()); s.free(); return { results: results, success: true }; };
          st.run = async function () { sqlite.run(sql, st.args); return { success: true }; };
          return st;
        },
        batch: async function (stmts) { var out = []; for (var s of stmts) out.push(await s.run()); return out; },
      };
      var mod = await import('../worker/worker.js');
      var env = { DB: DB };
      var call = function (url, init) { return mod.default.fetch(new Request(url, init), env); };
      window.fetch = async function (input, init) {
        var url = typeof input === 'string' ? input : input.url;
        if (url.indexOf('/api/portal') >= 0) {
          var path = url.slice(url.indexOf('/api/portal') + 11);
          return call('https://x.test/api/portal' + path, init);
        }
        return realFetch(input, init);
      };
      sqlite.run("INSERT OR IGNORE INTO items (id, data, updated_at) VALUES ('acc-marka','{\"id\":\"acc-marka\",\"name\":\"مركى\",\"category\":\"acc\",\"price\":80,\"w\":0.6,\"h\":0.35,\"active\":true}','2026-01-01')");
      sqlite.run("INSERT OR IGNORE INTO items (id, data, updated_at) VALUES ('fab1','{\"id\":\"fab1\",\"name\":\"قطيفة\",\"category\":\"fabric\",\"price\":10,\"active\":true}','2026-01-01')");
      var html = await (await realFetch('../portal.html')).text();
      var doc = new DOMParser().parseFromString(html, 'text/html');
      doc.querySelectorAll('script').forEach(function (s) { s.remove(); });
      var wrap = document.createElement('div');
      wrap.innerHTML = doc.body.innerHTML;
      document.body.appendChild(wrap);
      for (var p of ['../js/designer.js', '../js/portal.js']) {
        var s = document.createElement('script');
        s.textContent = await (await realFetch(p)).text();
        document.body.appendChild(s);
      }
      var q = function (sel) { return document.querySelector(sel); };
      var qAll = function (sel) { return Array.from(document.querySelectorAll(sel)); };
      log('stage: scripts-injected');
      await waitFor(function () { return window.PortalTest && q('#pStart'); });
      log('stage: booted');
      var P = window.PortalTest;
      var sofas = function () { return (P.state().pieces || []).filter(function (x) { return x.kind === 'sofa'; }); };
      var accs = function () { return (P.state().pieces || []).filter(function (x) { return x.kind === 'acc'; }); };
      var tools = function (tt) {
        var b = qAll('#pTools button').filter(function (x) { return x.dataset.t === tt; })[0];
        if (!b) throw new Error('missing tool ' + tt);
        b.click();
      };
      var step = function (i) { qAll('#pSteps button')[i].click(); };

      // A: بدء + الافتراضي أرضية
      q('#pStart').click();
      try {
        await waitFor(function () { return !q('#pDesign').hidden && P.state(); }, 120000);
      } catch (e) {
        log('STUCK designHidden=' + q('#pDesign').hidden + ' designer=' + !!P.designer() + ' toast=' + q('#pToast').textContent + ' landingHidden=' + q('#pLanding').hidden);
        throw e;
      }
      t('F-start', P.state().walls.length === 4);
      // R: المراحل الخمس مسماة + التوسيط محسوب
      var stepLabels = qAll('#pSteps button').map(function (b) { return b.textContent.replace(/^[0-9]+/, '').trim(); });
      t('R-steps', JSON.stringify(stepLabels) === JSON.stringify(['الغرفة', 'العناصر المعمارية', 'المجلس', 'الأثاث والإكسسوارات', 'المراجعة']), stepLabels.join('|'));
      t('R-centered', getComputedStyle(q('#pSteps')).justifyContent === 'center', 'centered');
      t('R-no-rect-btn', !q('#pfRect'), 'no apply button');
      // R2: بُعد حي — الكتابة تحدّث الجدار فورًا بلا زر وبلا فقدان التركيز
      q('#pfW').focus();
      q('#pfW').value = '6';
      q('#pfW').dispatchEvent(new Event('input', { bubbles: true }));
      t('R-live-w', P.state().walls[0].len === 6, 'w=' + P.state().walls[0].len);
      t('R-focus', document.activeElement === q('#pfW'), 'focus kept');
      q('#pfH').value = '5';
      q('#pfH').dispatchEvent(new Event('input', { bubbles: true }));
      t('R-live-h', P.state().walls[1].len === 5, 'h=' + P.state().walls[1].len);
      // R3: الغرفة المخصصة لا تُهدم بالتحديث الحي
      q('#pfAddWall').click();
      await waitFor(function () { return q('#pwLen'); }, 60000);
      q('#pwLen').value = '2';
      q('#pwOk').click();
      await waitFor(function () { return P.state().walls.length === 5; }, 60000);
      q('#pfW').value = '7';
      q('#pfW').dispatchEvent(new Event('input', { bubbles: true }));
      t('R-custom-kept', P.state().walls.length === 5 && P.state().walls[0].len === 7, 'custom room kept');
      step(2);
      await waitFor(function () { return q('#pfSeat'); });
      t('F-default-floor', q('#pfSeat').value === 'floor', q('#pfSeat') && q('#pfSeat').value);

      // B: فرش الكل من خطوة المجلس = جلسة أرضية + بلا تكرار
      var fillBtn = function () { return q('#pfFillMajlis'); };
      await waitFor(function () { return fillBtn() && fillBtn().textContent.indexOf('فرش الكل') >= 0; });
      fillBtn().click();
      await waitFor(function () { return sofas().length > 0; }, 60000);
      var c1 = sofas().length;
      t('F-fill-floor', sofas().every(function (x) { return (x.seating || 'floor') === 'floor'; }), c1 + ' sofas');
      fillBtn().click();
      t('F-fill-nodup', sofas().length === c1, c1 + '->' + sofas().length);

      // C: تغيير النوع يحفظ الغرفة + كنبة جديدة بالنوع الجديد
      P.state().pieces.filter(function (x) { return x.kind === 'sofa'; }).forEach(function (x) {
        P.designer().select({ type: 'piece', id: x.id });
        P.designer().removeSelected();
      });
      t('F-cleared', sofas().length === 0, 'room emptied');
      q('#pfSeat').value = 'arabic';
      q('#pfSeat').dispatchEvent(new Event('change', { bubbles: true }));
      var wallsBefore = P.state().walls.length;
      step(3);
      await waitFor(function () { return q('#pPanel button[data-sofa="wall"]'); });
      q('#pPanel button[data-sofa="wall"]').click();
      await waitFor(function () { return sofas().some(function (x) { return x.seating === 'arabic'; }); }, 60000);
      t('F-seating-change', P.state().walls.length === wallsBefore, 'walls kept');
      t('F-seating-kept', localStorage.getItem('majlis_seating') === 'arabic', 'persisted');

      // D: مشب وعامود من خطوة الفتحات
      step(1);
      await waitFor(function () { return q('#pPanel button[data-add="mashab"]'); });
      var addBtns = {};
      qAll('#pPanel button[data-add]').forEach(function (b) { addBtns[b.dataset.add] = b; });
      t('D-add-buttons', !!(addBtns.door && addBtns.mashab && addBtns.column) && !q('#pPanel button[data-add="window"]'), 'door/mashab/column, no window');
      addBtns.mashab.click();
      await waitFor(function () { return (P.state().openings || []).some(function (o) { return o.type === 'mashab'; }); }, 60000);
      t('F-mashab', true);
      addBtns.column.click();
      await waitFor(function () { return (P.state().pieces || []).some(function (x) { return x.kind === 'column'; }); }, 60000);
      var col0 = P.state().pieces.filter(function (x) { return x.kind === 'column'; })[0];
      var bb0 = P.designer().geometry().bb;
      t('F-column', col0.x >= bb0.minX && col0.x <= bb0.maxX && col0.y >= bb0.minY && col0.y <= bb0.maxY, 'column inside room');

      // D2: محرر الفتحات المدمج — سطر واحد لا يغطي الرسم
      P.designer().select(null);
      await waitFor(function () { return q('#pSheet').hidden; }, 60000);
      (function () {
        var dz = P.designer();
        var mop = P.state().openings.filter(function (o) { return o.type === 'mashab'; })[0];
        if (!mop) throw new Error('no mashab to select');
        dz.select({ type: 'opening', id: mop.id });
      })();
      await waitFor(function () { return q('#pSheet .opsheet'); }, 60000);
      t('D2-compact', q('#pSheet').dataset.compact === '1', 'compact attr');
      var shR = q('#pSheet').getBoundingClientRect();
      t('D2-small', shR.height <= 230, 'sheetH=' + Math.round(shR.height));
      await waitFor(function () {
        var c = q('#pCanvas').getBoundingClientRect(), s = q('#pSheet').getBoundingClientRect();
        return Math.max(0, Math.min(c.bottom, s.top) - Math.max(c.top, 0)) > 80;
      }, 30000);
      var cvR2 = q('#pCanvas').getBoundingClientRect(), shR2 = q('#pSheet').getBoundingClientRect();
      t('D2-visible', true, 'visibleCanvas=' + Math.round(Math.max(0, Math.min(cvR2.bottom, shR2.top) - Math.max(cvR2.top, 0))));
      var wBefore2 = P.state().openings.filter(function (o) { return o.type === 'mashab'; })[0].w;
      q('#pSheet [data-owplus]').click();
      await waitFor(function () {
        return P.state().openings.filter(function (o) { return o.type === 'mashab'; })[0].w > wBefore2;
      }, 60000);
      t('D2-stepper', true);
      step(1);
      await waitFor(function () { return q('#pPanel input[data-opw]'); }, 60000);
      var pwBefore = P.state().openings.filter(function (o) { return o.type === 'mashab'; })[0].w;
      q('#pPanel [data-opwplus]').click();
      await waitFor(function () {
        return P.state().openings.filter(function (o) { return o.type === 'mashab'; })[0].w > pwBefore;
      }, 60000);
      t('D2-panel', true);
      P.designer().select({ type: 'opening', id: P.state().openings.filter(function (o) { return o.type === 'mashab'; })[0].id });
      await waitFor(function () { return q('#pSheet .opsheet [data-del]'); }, 60000);
      q('#pSheet .opsheet [data-del]').click();
      await waitFor(function () { return P.state().openings.length === 0; }, 60000);
      t('D2-delete', true);
      // D2b: مسافات حية من حافتي الباب لطرفي الجدار (تُحسب من الحافة لا المركز)
      var gDoor = P.designer().addOpening(0, 'door');
      var gGaps = gDoor && P.designer().openingGaps(gDoor.id);
      var gW0 = P.designer().geometry().walls[0].len;
      t('D2-gaps', !!(gDoor && gGaps && gGaps.left >= 0 && gGaps.right >= 0 &&
        Math.abs(gGaps.left + gDoor.w + gGaps.right - gW0) < 0.01), JSON.stringify(gGaps));
      if (gDoor) P.designer().removeOpening(gDoor.id);
      // D3: اختيار الجدار من القائمة ثم «باب» — ينفّذ على ذلك الجدار بلا لمس المخطط
      P.state().openings = [];
      step(1);
      await waitFor(function () { return q('#pPanel select#pfOWall'); }, 60000);
      var selW = q('#pPanel select#pfOWall');
      t('D3-wall-select', !!selW && selW.options.length >= 2, 'wall dropdown');
      selW.value = '3';
      selW.dispatchEvent(new Event('change', { bubbles: true }));
      q('#pPanel button[data-add="door"]').click();
      await waitFor(function () { return (P.state().openings || []).some(function (o) { return o.type === 'door'; }); }, 60000);
      var dW = (P.state().openings || []).filter(function (o) { return o.type === 'door'; })[0];
      t('D3-door-on-wall4', !!dW && dW.wall === 3, 'wall=' + (dW && dW.wall));
      selW = q('#pPanel select#pfOWall');
      selW.value = '1';
      selW.dispatchEvent(new Event('change', { bubbles: true }));
      q('#pPanel button[data-add="mashab"]').click();
      await waitFor(function () { return (P.state().openings || []).some(function (o) { return o.type === 'mashab'; }); }, 60000);
      var mW = (P.state().openings || []).filter(function (o) { return o.type === 'mashab'; })[0];
      t('D3-mashab-on-wall2', !!mW && mW.wall === 1, 'wall=' + (mW && mW.wall));
      // D4: السحب باللمس يُخفي ورقة الخصائص، والنقرة تعيدها
      step(3);
      await waitFor(function () { return q('#pPanel button[data-sofa="wall"]'); }, 60000);
      q('#pPanel button[data-sofa="wall"]').click();
      await waitFor(function () { return P.state().pieces.some(function (x) { return x.kind === 'sofa'; }); }, 60000);
      var dzp = P.designer(), dCv = dzp.canvas;
      dzp.fitView();
      var dR = dCv.getBoundingClientRect();
      var dSofa = P.state().pieces.filter(function (x) { return x.kind === 'sofa'; })[0];
      // نقطة بعيدة عن المقابض (أعلى يسار القطعة) حتى يقع النقر على الجسم لا على مقبض تغيير الحجم
      var dPos = dzp.toScreen(dSofa.x - dSofa.w / 4, dSofa.y - dSofa.h / 4);
      var ptype = function (type, x, y) { dCv.dispatchEvent(new PointerEvent(type, { pointerId: 7, pointerType: 'touch', clientX: dR.left + x, clientY: dR.top + y, bubbles: true, cancelable: true, isPrimary: true, button: 0 })); };
      dzp.select({ type: 'piece', id: dSofa.id });
      await waitFor(function () { return !q('#pSheet').hidden; }, 60000);
      t('D4-sheet-on-tap', !q('#pSheet').hidden, 'sheet visible on tap');
      ptype('pointerdown', dPos.x, dPos.y);
      await waitFor(function () { return dzp.drag && dzp.drag.mode === 'move'; }, 60000);
      ptype('pointermove', dPos.x + 26, dPos.y + 18);
      ptype('pointermove', dPos.x + 40, dPos.y + 26);
      await waitFor(function () { return q('#pSheet').hidden; }, 60000);
      t('D4-sheet-hides-on-drag', q('#pSheet').hidden, 'sheet hidden while dragging');
      ptype('pointerup', dPos.x + 40, dPos.y + 26);
      await waitFor(function () { return !dzp.drag; }, 60000);
      var movedSofa = P.state().pieces.filter(function (x) { return x.id === dSofa.id; })[0];
      t('D4-moved', movedSofa && (Math.abs(movedSofa.x - dSofa.x) > 0.01 || Math.abs(movedSofa.y - dSofa.y) > 0.01), 'piece moved');
      await new Promise(function (r) { setTimeout(r, 60); });
      dzp.select({ type: 'piece', id: dSofa.id });
      await waitFor(function () { return !q('#pSheet').hidden; }, 60000);
      t('D4-sheet-returns', !q('#pSheet').hidden, 'sheet back on new tap');
      // D5: سحب قطعة لا يمرّر الصفحة (touchmove ملغى)، وسحب الفراغ يمرّرها (سلوك مقصود)
      var nTouchEv = [];
      var nProbe = function (e) { nTouchEv.push({ cancelable: e.cancelable, defaultPrevented: e.defaultPrevented, mode: dzp.drag ? dzp.drag.mode : 'none' }); };
      document.addEventListener('touchmove', nProbe, true);
      var nD5Piece = dz_d5_piece(dzp) || dSofa;
      function dz_d5_piece(d) { return d.selectedPiece() || P.state().pieces.filter(function (x) { return x.kind === 'sofa'; })[0]; }
      // نقطة داخل الجسم بعيدة عن المقابض (فوق اليسار ربع قطعة)
      var dPos2 = dzp.toScreen(nD5Piece.x - nD5Piece.w / 5, nD5Piece.y - nD5Piece.h / 5);
      var nEvInit = { bubbles: true, cancelable: true, clientX: dR.left + dPos2.x, clientY: dR.top + dPos2.y, pointerId: 31, pointerType: 'touch', isPrimary: true, button: 0 };
      dCv.dispatchEvent(new PointerEvent('pointerdown', nEvInit));
      await waitFor(function () { return dzp.drag && dzp.drag.mode === 'move'; }, 60000);
      dCv.dispatchEvent(new PointerEvent('pointermove', Object.assign({}, nEvInit, { clientX: nEvInit.clientX + 24, clientY: nEvInit.clientY + 16 })));
      var dTm = new Event('touchmove', { bubbles: true, cancelable: true });
      Object.defineProperty(dTm, 'touches', { value: [{ clientX: nEvInit.clientX + 24, clientY: nEvInit.clientY + 16 }] });
      document.dispatchEvent(dTm);
      dCv.dispatchEvent(new PointerEvent('pointerup', Object.assign({}, nEvInit, { clientX: nEvInit.clientX + 24, clientY: nEvInit.clientY + 16 })));
      await waitFor(function () { return !dzp.drag; }, 60000);
      document.removeEventListener('touchmove', nProbe, true);
      t('D5-block-scroll-on-piece', dTm.defaultPrevented === true, 'touchmove prevented while moving piece=' + dTm.defaultPrevented);
      // سحب الفراغ = pan يمرّر الصفحة (يبقى السلوك المقصود)
      nTouchEv = [];
      document.addEventListener('touchmove', nProbe, true);
      var emptyX = dzp.toScreen(dzp.geometry().bb.minX - 0.4, dzp.geometry().bb.minY - 0.4);
      var dEv2 = { bubbles: true, cancelable: true, clientX: dR.left + emptyX.x, clientY: dR.top + emptyX.y, pointerId: 32, pointerType: 'touch', isPrimary: true, button: 0 };
      dCv.dispatchEvent(new PointerEvent('pointerdown', dEv2));
      dCv.dispatchEvent(new PointerEvent('pointermove', Object.assign({}, dEv2, { clientX: dEv2.clientX + 20, clientY: dEv2.clientY + 20 })));
      var dTm2 = new Event('touchmove', { bubbles: true, cancelable: true });
      Object.defineProperty(dTm2, 'touches', { value: [{ clientX: dEv2.clientX + 20, clientY: dEv2.clientY + 20 }] });
      document.dispatchEvent(dTm2);
      dCv.dispatchEvent(new PointerEvent('pointerup', Object.assign({}, dEv2, { clientX: dEv2.clientX + 20, clientY: dEv2.clientY + 20 })));
      await waitFor(function () { return !dzp.drag; }, 60000);
      document.removeEventListener('touchmove', nProbe, true);
      t('D5-pan-still-scrolls', dTm2.defaultPrevented === false, 'pan keeps page scroll=' + dTm2.defaultPrevented);
      window.scrollTo(0, 0);   // pan حرّك الصفحة: نعيدها لتفادي 影响 بقية الخطوات
      await new Promise(function (r) { setTimeout(r, 80); });

      // E: إكسسوار + كمية 5 حقيقية
      step(3);
      await waitFor(function () { return q('#pPanel button[data-acc]'); });
      q('#pPanel button[data-acc]').click();
      await waitFor(function () { return accs().length === 1; }, 60000);
      var first = accs()[0];
      P.designer().select({ type: 'piece', id: first.id });
      await waitFor(function () { return q('#psQty'); }, 60000);
      var qinp = q('#psQty');
      qinp.value = '5';
      qinp.dispatchEvent(new Event('change', { bubbles: true }));
      await waitFor(function () { return accs().length === 5; }, 60000);
      t('F-qty5', accs().every(function (x) { return x.itemId === first.itemId; }), '5 real copies');
      // حفظ صريح ثم إعادة قراءة من الخادم
      var tok = localStorage.getItem('majlis_design_token');
      var saved = await (await window.fetch('/api/portal/save', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-design-token': tok }, body: JSON.stringify({ design: P.state() }) })).json();
      t('F-qty-saved', saved.ok === true, JSON.stringify(saved).slice(0, 100));
      var got = await (await window.fetch('/api/portal/design', { headers: { 'x-design-token': tok } })).json();
      var racc = (got.design.pieces || []).filter(function (x) { return x.kind === 'acc'; });
      t('F-qty-reload', racc.length === 5, racc.length + ' persisted');
      // رفض 0 والسالب وغير الرقمي
      var bads = ['0', '-3', 'abc'];
      for (var bi = 0; bi < bads.length; bi++) {
        q('#psQty').value = bads[bi];
        q('#psQty').dispatchEvent(new Event('change', { bubbles: true }));
      }
      t('F-qty-invalid', accs().length === 5, accs().length + ' kept');

      // F: تدوير/نسخ/حذف
      var one = accs()[0];
      P.designer().select({ type: 'piece', id: one.id });
      await waitFor(function () { return q('#pSheet [data-rot]'); });
      var rot0 = one.rot || 0;
      q('#pSheet [data-rot]').click();
      await waitFor(function () {
        var cur = P.state().pieces.filter(function (x) { return x.id === one.id; })[0];
        return cur && cur.rot !== rot0;
      }, 60000);
      t('F-rotate', true);
      var nBefore = accs().length;
      q('#pSheet [data-dup]').click();
      await waitFor(function () { return accs().length === nBefore + 1; }, 60000);
      t('F-duplicate', true);
      var delId = accs()[0].id;
      P.designer().select({ type: 'piece', id: delId });
      await waitFor(function () { return q('#pSheet [data-del]'); });
      q('#pSheet [data-del]').click();
      await waitFor(function () { return P.state().pieces.filter(function (x) { return x.id === delId; }).length === 0; }, 60000);
      t('F-delete', true);

      // I: توزيع ذكي + مساحة غير كافية (غرفة صغيرة مملوءة جزئياً — كل الأعداد ديناميكية)
      P.designer().setRect(0.9, 0.9);
      P.designer().state.openings = [];
      P.state().pieces.slice().forEach(function (x) {
        P.designer().select({ type: 'piece', id: x.id });
        P.designer().removeSelected();
      });
      P.designer().select(null);
      t('I-cleared', P.state().pieces.length === 0, 'slate clean');
      step(3);
      await waitFor(function () { return q('#pPanel button[data-acc]'); });
      var addFreshAcc = function () {
        var before = accs().map(function (x) { return x.id; });
        q('#pPanel button[data-acc]').click();
        var nw = accs().filter(function (x) { return before.indexOf(x.id) < 0; })[0];
        if (!nw) throw new Error('no fresh acc');
        return nw;
      };
      var setQtyOf = function (piece, v) {
        P.designer().select({ type: 'piece', id: piece.id });
        var inp = q('#psQty');
        if (!inp) throw new Error('no qty sheet');
        inp.value = String(v);
        inp.dispatchEvent(new Event('change', { bubbles: true }));
      };
      var fA = addFreshAcc();
      setQtyOf(fA, 99);
      var grpA = function () {
        return P.state().pieces.filter(function (x) { return x.kind === 'acc' && x.itemId === fA.itemId && (x.qg || '') === (fA.qg || ''); });
      };
      t('I-fillroom', grpA().length >= 1, grpA().length + ' fill room');
      grpA().slice(0, 2).forEach(function (m) {
        P.designer().select({ type: 'piece', id: m.id });
        P.designer().removeSelected();
      });
      P.designer().select(null);
      var fB = addFreshAcc();
      P.designer().select({ type: 'piece', id: fB.id });
      await waitFor(function () { return q('#psQty'); }, 60000);
      q('#psQty').value = '6';
      q('#psQty').dispatchEvent(new Event('change', { bubbles: true }));
      var grp = P.state().pieces.filter(function (x) { return x.kind === 'acc' && x.itemId === fB.itemId && (x.qg || '') === (fB.qg || ''); });
      var bbi = P.designer().geometry().bb;
      var insideAll = grp.every(function (x) { return x.x >= bbi.minX && x.x <= bbi.maxX && x.y >= bbi.minY && x.y <= bbi.maxY; });
      var toastTx = q('#pToast').textContent;
      t('I-fit', grp.length <= 6 && grp.length >= 1, grp.length + ' placed');
      t('I-inside', insideAll, 'all inside room');
      var placedM = toastTx.match(/تم وضع (\d+)/);
      t('I-warn', grp.length < 6 ? (!!placedM && Number(placedM[1]) === grp.length && toastTx.indexOf('6') >= 0) : true, toastTx.slice(0, 80));
      var colsNow = P.state().pieces.filter(function (x) { return x.kind === 'column'; });
      var noColHit = grp.every(function (g) {
        return !colsNow.some(function (c) {
          return Math.abs(g.x - c.x) < (g.w + c.w) / 2 - 0.02 && Math.abs(g.y - c.y) < (g.h + c.h) / 2 - 0.02;
        });
      });
      t('I-nocolumn', noColHit, 'no furniture on columns');

      // J: سحب مقيد بالحدود + ارتداد عن العامود (عامود جديد داخل الغرفة الصغيرة)
      step(1);
      await waitFor(function () { return q('#pPanel button[data-add="column"]'); });
      q('#pPanel button[data-add="column"]').click();
      await waitFor(function () {
        return P.state().pieces.some(function (x) { return x.kind === 'column'; });
      }, 60000);
      var jp = grp[0];
      P.designer().select({ type: 'piece', id: jp.id });
      P.designer().moveSelected(100, 100);
      var jpAfter = P.state().pieces.filter(function (x) { return x.id === jp.id; })[0];
      t('J-clamp', jpAfter.x <= bbi.maxX && jpAfter.y <= bbi.maxY, 'clamped to room');
      var colJ = P.state().pieces.filter(function (x) { return x.kind === 'column'; }).pop();
      var cv = document.querySelector('#pCanvas');
      var rect = cv.getBoundingClientRect();
      var toClient = function (x, y) { var s = P.designer().toScreen(x, y); return { x: rect.left + s.x, y: rect.top + s.y }; };
      var pe = function (type, cx, cy) {
        return new PointerEvent(type, { bubbles: true, cancelable: true, clientX: cx, clientY: cy, button: 0, pointerId: 1, pointerType: 'mouse', isPrimary: true });
      };
      var ox = jpAfter.x, oy = jpAfter.y;
      var s0 = toClient(ox, oy), s1 = toClient(colJ.x, colJ.y);
      cv.dispatchEvent(pe('pointerdown', s0.x, s0.y));
      cv.dispatchEvent(pe('pointermove', s1.x, s1.y));
      cv.dispatchEvent(pe('pointerup', s1.x, s1.y));
      var jpEnd = P.state().pieces.filter(function (x) { return x.id === jp.id; })[0];
      var reverted = Math.abs(jpEnd.x - ox) < 0.05 && Math.abs(jpEnd.y - oy) < 0.05;
      t('J-revert', reverted, 'reverted off column');
      // التوزيع يتجنب العامود الموجود
      P.designer().select({ type: 'piece', id: jp.id });
      await waitFor(function () { return q('#psQty'); }, 60000);
      var curN = P.state().pieces.filter(function (x) { return x.kind === 'acc' && x.itemId === jp.itemId && (x.qg || '') === (jp.qg || ''); }).length;
      var idsJ = P.state().pieces.map(function (x) { return x.id; });
      q('#psQty').value = String(curN + 2);
      q('#psQty').dispatchEvent(new Event('change', { bubbles: true }));
      var freshJ = P.state().pieces.filter(function (x) { return idsJ.indexOf(x.id) < 0; });
      var hitCol = freshJ.some(function (g) {
        return Math.abs(g.x - colJ.x) < (g.w + colJ.w) / 2 - 0.02 && Math.abs(g.y - colJ.y) < (g.h + colJ.h) / 2 - 0.02;
      });
      t('J-avoidcol', !hitCol, freshJ.length + ' new avoid column');

      // G: مراحل وأزرار كل مرحلة + زوم خارج الرسم
      step(1);
      await waitFor(function () { return q('#pPanel button[data-add="column"]'); });
      t('G-openings', !!q('#pPanel button[data-add="door"]') && !!q('#pPanel button[data-add="mashab"]'), 'door/mashab/column');
      step(2);
      await waitFor(function () { return q('#pfFillMajlis'); });
      t('G-majlis', q('#pfFillMajlis').textContent.indexOf('فرش الكل') >= 0, 'فرش الكل in majlis');
      step(3);
      await waitFor(function () { return q('#pPanel button[data-sofa="wall"]'); });
      t('G-furn', !!q('#pPanel button[data-acc]'), 'furniture grid');
      t('G-zoom-outside', !q('.p-canvas').querySelector('button') && !!q('.p-zoombar #pZoomFit'), 'zoom outside');
      var zb = qAll('.p-zoombar .btn');
      t('G-zoom-44', zb.every(function (x) { return x.getBoundingClientRect().height >= 44; }), 'zoom sizes');

      // K: حذف الأعمدة من القائمة
      step(1);
      await waitFor(function () { return q('#pPanel button[data-coldel]'); });
      qAll('#pPanel button[data-coldel]').forEach(function (b) { b.click(); });
      t('K-coldel', P.state().pieces.filter(function (x) { return x.kind === 'column'; }).length === 0, 'columns deleted');

      // M: PDF وواتساب من خطوة المراجعة (CDN حقيقي، spy على التنزيل/الفتح)
      step(4);
      await waitFor(function () { return q('#pActPdf') && q('#pActWa'); }, 60000);
      var openedBlobs = [];
      var _co = URL.createObjectURL.bind(URL);
      URL.createObjectURL = function (b) { openedBlobs.push(b); return _co(b); };
      var openedUrls = [];
      window.open = function (u) { openedUrls.push(u); return null; };
      q('#pToast').textContent = '';
      q('#pToast').className = 'toast';
      q('#pActPdf').click();
      await waitFor(function () { return openedBlobs.length > 0 || q('#pToast').textContent.length > 0; }, 240000);
      t('M-pdf', openedBlobs.length > 0 && openedBlobs[0] instanceof Blob, openedBlobs.length + ' blob toast=' + q('#pToast').textContent.slice(0, 100));
      q('#pActWa').click();
      await waitFor(function () { return openedUrls.length > 0 || q('#pToast').textContent.indexOf('PDF') >= 0; }, 120000);
      t('M-wa', openedUrls.some(function (u) { return u.indexOf('wa.me/0512345678') >= 0; }) || q('#pToast').textContent.length > 0, (openedUrls[0] || 'toast-fallback').slice(0, 60));

      // H: مراجعة وإنهاء برقم
      q('#pFinish').click();
      var no = '';
      await waitFor(function () { return q('#pSubmitDesign'); }, 60000);
      q('#pSubmitDesign').click();
      await waitFor(function () { return !q('#pDone').hidden; }, 120000);
      no = q('#pDesignNo').textContent;
      t('H-finish', /^MJ-\d+$/.test(no), no);

      window.fetch = realFetch;
    } catch (e) {
      bad++; log('FAIL harness :: ' + (e.stack || e.message || e));
    } finally {
      try { window.fetch = realFetch; } catch (_) { /* noop */ }
      if (window.TEST_ERRORS.length) { bad++; log('WINDOW ERRORS: ' + window.TEST_ERRORS.join(' | ')); }
      var verdict = bad === 0 ? ('PASS ' + n + '/' + n) : 'FAIL';
      document.getElementById('testResult').textContent = verdict;
      document.title = verdict;
      log('---- ' + verdict + ' ----');
    }
  })();
})();
</script>
</body>
</html>
