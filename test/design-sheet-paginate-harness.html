<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>design-sheet one-page harness</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { margin: 0; background: #eee; }
  #mount { position: fixed; left: -20000px; top: 0; background: #fff; }
  #pdfMount { position: fixed; left: -20000px; top: 0; }
  #note { font: 14px system-ui; padding: 8px; }
</style>
</head><body>
<div id="note">design-sheet one-page harness</div>
<div id="mount"></div>
<div id="pdfMount"></div>
<script src="../node_modules/html2canvas/dist/html2canvas.min.js"></script>
<script src="../node_modules/jspdf/dist/jspdf.umd.min.js"></script>
<script src="../js/designer.js"></script>
<script src="../js/design-sheet.js"></script>
<script>
/* سيناريوهات ورقة التصميم الواحدة: فارغ/قليل/متوسط/كبير/طويل/ضخم/دليل طويل/ترويسة طويلة.
   كل سيناريو يُبنى بالمحرّك نفسه الذي يصدر PDF، ثم يُقاس فعلياً وهو موصول. */
(function () {
  function sofas(n, w0, step) {
    var out = [];
    for (var i = 0; i < n; i++) {
      out.push({
        kind: 'sofa', w: +(w0 + i * step).toFixed(2), h: 0.8, rot: 0,
        x: 0.3, y: 0.3, seating: i % 3 === 0 ? 'sofa' : (i % 3 === 1 ? 'arabic' : 'floor'),
        fabricId: null
      });
    }
    return out;
  }
  function accs(n) {
    var out = [];
    for (var i = 0; i < n; i++) out.push({ kind: 'acc', itemId: 'a' + (i + 1), w: 0.4, h: 0.4, rot: 0, x: 0.1, y: 0.1 });
    return out;
  }
  function getItem(id) {
    if (!id) return null;
    var n = { a1: 'سفرة جانبية', a2: 'طاولة وسط', a3: 'مزهرية', a4: 'خزانة', a5: 'مرآة', a6: 'سجادة',
      a7: 'مصباح أرضي', a8: 'براد', a9: 'وسائد', a10: 'رفّ كتب', a11: 'نبّورة', a12: 'ستارة',
      a13: 'ساعة حائط', a14: 'زربية', a15: 'أباجورة', a16: 'كوخ', a17: 'صندوق تنظيم',
      a18: 'طاولة قهوة', a19: 'كرسي إضافي', a20: 'مشجب', a21: 'طاولة تقديم خشب جوز طبيعي بحواف نحاسية (Walnut Serving Table)' };
    return { id: id, name: n[id] || ('قطعة ' + id), color: '#' + ((id.length * 7919 + id.charCodeAt(id.length - 1) * 131) % 0xffffff).toString(16).padStart(6, '0') };
  }
  var WALLS = [{ len: 5, angle: 0 }, { len: 4, angle: 90 }, { len: 5, angle: 180 }, { len: 4, angle: 270 }];
  var LONG_NOTE = 'يُنفَّذ التصميم بعد معاينة المحل والتأكد من المقاسات النهائية. '
    + Array(6).join('تُراجع القياسات مع فريق التركيب قبل التسليم، ويُبلَّغ فريق الصيانة عن أي ملاحظة. ');

  var SCENARIOS = {
    empty: { walls: WALLS, pieces: [] },
    few: { walls: WALLS, pieces: sofas(3, 2.0, 0.4) },
    medium: { walls: WALLS, pieces: sofas(10, 1.6, 0.3) },
    large: { walls: WALLS, pieces: sofas(45, 1.0, 0.1).concat(accs(12)) },
    long: { walls: WALLS, pieces: sofas(60, 1.0, 0.1).concat(accs(21)) },
    huge: { walls: WALLS, pieces: sofas(120, 1.0, 0.05).concat(accs(21)) },
    tall: { walls: WALLS, pieces: sofas(3, 2.0, 0.4).concat(accs(45)) },
    longmeta: { walls: WALLS, pieces: sofas(6, 1.8, 0.2).concat(accs(21)) },
    /* غرفة كبيرة: مساحات بخانتين (45.00 م²، 16.79 م²…) — كانت تتجاوز خانتها وتُقصّ */
    bigroom: { walls: [{ len: 7.5, angle: 0 }, { len: 6, angle: 90 }, { len: 7.5, angle: 180 }, { len: 6, angle: 270 }], pieces: sofas(8, 2.4, 0.35).concat(accs(4)) }
  };

  function optsFor(kind) {
    var o = {
      design: SCENARIOS[kind],
      getItem: getItem,
      pieceStyle: function () { return null; },
      footHtml: '<div class="inv-contact"><b>تواصل معنا</b>'
        + '<div class="inv-chans-hint">امسح رمز QR أو اضغط عليها لفتح الحساب مباشرة</div>'
        + '<div class="inv-chans"><div class="inv-chan" data-url="https://wa.me/966549955622">'
        + '<span class="inv-chan-lb">واتساب</span></div></div></div>'
        + '<div class="ds-foot-note"><b>أصالة نجد</b>احتفظ برقم التصميم لمراجعته مع المحل</div>',
      meta: [{ label: 'رقم الطلب', value: '#410' }, { label: 'العميل', value: 'عبدالله الشمري' }]
    };
    if (kind === 'long' || kind === 'huge') { o.note = LONG_NOTE; o.caption = 'ورقة تصميم مجلس — نسخة الموظف'; }
    if (kind === 'longmeta') {
      o.meta = [{ label: 'رقم التصميم', value: 'MJ-26000127' },
        { label: 'العميل', value: 'عبدالرحمن بن عبدالعزيز بن محمد آل الشيخ القحطاني — Mohammed Al-Otaibi (VIP)' },
        { label: 'الجوال', value: '+966 54 995 5622' }];
    }
    return o;
  }

  /** قياس الورقة كما هي في PDF: حدود، تجاوز، أصغر خط، مقاس المخطط، وكل المحتوى */
  function measure(el) {
    var sz = el.__size, k = el.getBoundingClientRect().width / sz.w;
    var R = el.getBoundingClientRect();
    var side = el.querySelector('.ds-side'), foot = el.querySelector('.ds-foot');
    var bottom = 0, i;
    for (i = 0; i < side.children.length; i++) bottom = Math.max(bottom, side.children[i].getBoundingClientRect().bottom);
    var obstacle = foot ? foot.getBoundingClientRect().top : R.bottom;
    var outside = [], clipped = [], minPt = 99, minPtEl = '';
    var all = el.querySelectorAll('*');
    for (i = 0; i < all.length; i++) {
      var e = all[i], r = e.getBoundingClientRect();
      if (!r.width && !r.height) continue;
      if (r.left < R.left - 1 || r.right > R.right + 1 || r.top < R.top - 1 || r.bottom > R.bottom + 1) outside.push(e.className || e.tagName);
      /* صندوق يقصّ محتواه عمودياً أو أفقياً (overflow غير مرئي) = معلومة مخفية */
      var ov = getComputedStyle(e).overflow;
      if (ov !== 'visible' && (e.scrollHeight > e.clientHeight + 1 || e.scrollWidth > e.clientWidth + 1)) clipped.push((e.className || e.tagName) + '#box');
      var own = [].some.call(e.childNodes, function (c) { return c.nodeType === 3 && c.textContent.trim(); });
      if (!own) continue;
      var fs = parseFloat(getComputedStyle(e).fontSize) * 0.75;
      if (fs < minPt) { minPt = fs; minPtEl = (e.className || e.tagName) + ':' + e.textContent.trim().slice(0, 20); }
      if (e.scrollWidth > e.clientWidth + 1 && getComputedStyle(e).overflow !== 'visible') clipped.push(e.className || e.tagName);
    }
    /* كل بند في ملخص المساحات: الاسم والقيمة داخل سطره كاملين ولا يتراكبان */
    [].forEach.call(el.querySelectorAll('.ds-areas-i'), function (row) {
      var B = row.getBoundingClientRect(), dt = row.querySelector('dt'), dd = row.querySelector('dd');
      [dt, dd].forEach(function (x) { if (!x) return; var r = x.getBoundingClientRect(); if (r.left < B.left - 0.5 || r.right > B.right + 0.5) clipped.push('areas-out:' + x.textContent.trim()); });
      if (dt && dd) { var a = dt.getBoundingClientRect(), b = dd.getBoundingClientRect(); if (a.left < b.right - 0.5 && b.left < a.right - 0.5 && a.top < b.bottom - 0.5 && b.top < a.bottom - 0.5) clipped.push('areas-overlap:' + dt.textContent.trim()); }
    });
    var img = el.querySelector('.ds-img');
    var rows = [].map.call(el.querySelectorAll('.ds-tbl tbody tr'), function (tr) {
      var tds = tr.querySelectorAll('td');
      return (tds.length === 1 && tds[0].className === 'ds-empty') ? null : [].map.call(tds, function (td) { return td.textContent.trim(); }).join(' | ');
    }).filter(Boolean);
    return {
      paper: el.__paper.id, paperW: el.__paper.w, paperH: el.__paper.h,
      widthMm: +(R.width / k).toFixed(1), heightMm: +(R.height / k).toFixed(1),
      sizeW: sz.w, sizeH: sz.h,
      overflowMm: +((bottom - (obstacle - 1.2 * k)) / k).toFixed(2),
      footInside: foot ? foot.getBoundingClientRect().bottom <= R.bottom + 1 : true,
      outside: outside.slice(0, 5), clipped: clipped.slice(0, 5),
      minPt: +minPt.toFixed(2), minPtEl: minPtEl,
      planW: img ? +(img.getBoundingClientRect().width / k).toFixed(1) : 0,
      planH: img ? +(img.getBoundingClientRect().height / k).toFixed(1) : 0,
      rows: rows,
      legend: [].map.call(el.querySelectorAll('.ds-legend li .lb'), function (x) { return x.textContent.trim(); }),
      note: (el.querySelector('.ds-note') || {}).textContent || '',
      cap: (el.querySelector('.ds-cap b') || {}).textContent || '',
      areas: !!el.querySelector('.ds-areas-wrap'),
      meta: [].map.call(el.querySelectorAll('.ds-meta dd'), function (x) { return x.textContent; }),
      metaClipped: [].some.call(el.querySelectorAll('.ds-meta dd'), function (x) { return x.scrollWidth > x.clientWidth + 1; }),
      pageof: !!el.querySelector('.ds-pageof')
    };
  }

  window.__build = function (kind) {
    return document.fonts.ready.then(function () {
      var mount = document.getElementById('mount');
      mount.innerHTML = '';
      var o = optsFor(kind);
      var pages = DesignSheet.buildPages(o, mount);
      var f = DesignSheet.facts(SCENARIOS[kind], o);
      return {
        kind: kind, n: pages.length,
        rowsExpected: f.rows.map(function (r) { return r.name + ' | ' + r.dims + ' | ' + r.qty; }),
        legendExpected: f.legend.map(function (e) { return e.label; }),
        noteExpected: f.note || '', capExpected: f.capacity > 0 ? String(f.capacity) : '',
        hasAreas: !!f.areas, metaExpected: (o.meta || []).map(function (x) { return x.value; }),
        m: pages[0] ? measure(pages[0]) : null
      };
    });
  };

  /* المعاينة على الشاشة (build) والملف (pdfBlob) يجب أن يختارا المقاس نفسه */
  window.__previewPaper = function (kind) {
    var el = DesignSheet.build(optsFor(kind));
    return el.__paper.id + ':' + el.__paper.w + 'x' + el.__paper.h;
  };

  window.__pdfClient = function (kind) {
    var mount = document.getElementById('pdfMount');
    mount.innerHTML = '';
    return DesignSheet.pdfBlob(Object.assign(optsFor(kind), { mount: mount }))
      .then(function (blob) { return blobTo64(blob); });
  };

  function blobTo64(blob) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { var s = String(fr.result); res(s.slice(s.indexOf(',') + 1)); };
      fr.onerror = rej;
      fr.readAsDataURL(blob);
    });
  }
})();
</script>
</body></html>
