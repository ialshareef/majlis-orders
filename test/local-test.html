<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار محلي (worker.js + SQLite)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="testStatus" style="position:fixed;bottom:0;left:0;z-index:9999;background:#111;color:#0f0;font:11px monospace;padding:2px 6px;direction:ltr">loading…</div>
<script>
/* صفحة اختبار للمطوّر: تشغّل worker/worker.js (المصدر لا النسخة المبنية) على قاعدة SQLite
   داخل المتصفح، مع واجهة التطبيق من ملفات المشروع مباشرة — لا اتصال بأي خادم حقيقي.
   شغّلها على منفذ غير منفذ التطبيق (مثلاً 8091) حتى لا تشارك جلسة الدخول المحفوظة. */
window.TEST = { log: [] };
  // تقرير فحص دخان آلي لمُشغّل اختبارات HTML (run-html-tests.mjs): الصفحة تبقى للاستخدام اليدوي كما هي،
  // وتعلن بعد الإقلاع نتيجة فحوص بسيطة في #testLog و#testResult بدل الانتظار حتى المهلة.
  const report = (checks) => {
    const pre = document.createElement('pre'); pre.id = 'testLog'; pre.style.cssText = 'position:fixed;top:24px;left:0;z-index:9999;max-height:40vh;overflow:auto;background:#fff;color:#111;font:11px monospace;direction:ltr;margin:0;padding:4px 6px';
    let bad = 0;
    pre.textContent = checks.map(([name, ok, why]) => { if (!ok) bad++; return (ok ? 'PASS ' : 'FAIL ') + name + (ok || !why ? '' : ' :: ' + why); }).join('\n');
    const res = document.createElement('div'); res.id = 'testResult'; res.hidden = true;
    res.textContent = bad ? 'FAIL' : 'PASS ' + checks.length + '/' + checks.length;
    document.body.appendChild(pre); document.body.appendChild(res);
  };
(async function boot() {
  const status = (m) => { document.getElementById('testStatus').textContent = m; window.TEST.log.push(m); };
  const realFetch = window.fetch.bind(window);
  try {
    status('sql.js…');
    const SQL = await initSqlJs({ locateFile: (f) => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/' + f });
    const sqlite = new SQL.Database();
    sqlite.exec(await (await realFetch('../worker/schema.sql')).text());
    window.TEST.sqlite = sqlite;
    const norm = (v) => (v === undefined ? null : (typeof v === 'boolean' ? (v ? 1 : 0) : v));
    const DB = {
      prepare(sql) {
        const st = { sql, args: [] };
        st.bind = (...a) => { st.args = a.map(norm); return st; };
        st.first = async () => { const s = sqlite.prepare(sql); s.bind(st.args); const has = s.step(); const row = has ? s.getAsObject() : null; s.free(); return row; };
        st.all = async () => { const s = sqlite.prepare(sql); s.bind(st.args); const results = []; while (s.step()) results.push(s.getAsObject()); s.free(); return { results, success: true }; };
        st.run = async () => { sqlite.run(sql, st.args); return { success: true }; };
        return st;
      },
      async batch(stmts) { const out = []; for (const s of stmts) out.push(await s.run()); return out; },
    };
    const mod = await import('../worker/worker.js');
    const env = { DB };
    const ORIGIN = 'https://majlis.test';
    const call = (url, init) => mod.default.fetch(new Request(url, init), env);
    window.fetch = async (input, init) => {
      const url = typeof input === 'string' ? input : input.url;
      if (url.startsWith(ORIGIN)) return call(url, init);
      return realFetch(input, init);
    };
    window.TEST.api = async (method, path, body, token) => {
      const headers = { 'Content-Type': 'application/json' }; if (token) headers['x-session-token'] = token;
      const init = { method, headers }; if (body != null && method !== 'GET') init.body = JSON.stringify(body);
      const r = await call(ORIGIN + path, init);
      return { status: r.status, body: await r.json().catch(() => null) };
    };
    const html = await (await realFetch('../index.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script').forEach((s) => s.remove());
    const wrap = document.createElement('div');
    wrap.innerHTML = doc.body.innerHTML;
    document.body.appendChild(wrap);
    // ?local=1 يختبر الوضع المحلي (localStorage) بدل الخادم
    window.APP_CONFIG = { apiUrl: new URLSearchParams(location.search).has('local') ? '' : ORIGIN };
    for (const p of ['../js/store.js', '../js/designer.js', '../js/app.js']) {
      const s = document.createElement('script');
      s.textContent = await (await realFetch(p)).text();
      document.body.appendChild(s);
    }
    await new Promise((r) => setTimeout(r, 400));
    status('READY');
    window.TEST.ready = true;
    const noTok = await window.TEST.api('GET', '/api/bootstrap');
    report([
      ['boot: worker.js + SQLite + واجهة المشروع', true],
      ['app: شاشة الدخول ظاهرة', !!document.getElementById('loginForm') && !document.getElementById('loginScreen').hidden],
      ['app: MajlisApp مُحمَّل', !!window.MajlisApp],
      ['api: bootstrap بلا جلسة = 401', noTok.status === 401, String(noTok.status)],
    ]);
  } catch (e) {
    console.error(e);
    status('ERROR: ' + e.message);
    window.TEST.error = e.message;
    report([['boot', false, e.message]]);
  }
})();
</script>
</body>
</html>
