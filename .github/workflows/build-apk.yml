name: Build Android APK & AAB

on:
  # تشغيل يدوي (من تبويب Actions أو من جلسة Claude Code في السحابة): بلا رقم = بناء تجريبي بلا إصدار؛
  # برقم (مثل 1.1.3) = إصدار كامل: يُنشأ الوسم vX.Y.Z على هذا الـ commit هنا داخل GitHub ثم يُبنى APK
  # ويُنشر في Releases — بديل دفع الوسم من الجهاز (بيئة السحابة لا تسمح بدفع الوسوم).
  workflow_dispatch:
    inputs:
      version:
        description: 'رقم الإصدار X.Y.Z (فارغ = بناء تجريبي بلا إصدار). يجب أن يكون أكبر من آخر وسم.'
        required: false
        default: ''
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # كل الوسوم: للتحقق من أن الإصدار اليدوي جديد وأكبر من آخر وسم

      - name: Set version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          IN="${INPUT_VERSION#v}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "$IN" ]; then
            if ! [[ "$IN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::رقم الإصدار يجب أن يكون X.Y.Z (مثل 1.1.3)، وصل: $IN"; exit 1; fi
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then echo "::error::الإصدار يُنشأ من main فقط (وصل ${GITHUB_REF})"; exit 1; fi
            if git rev-parse -q --verify "refs/tags/v$IN" >/dev/null; then echo "::error::الوسم v$IN موجود مسبقاً"; exit 1; fi
            LAST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -1)
            if [ -n "$LAST" ] && [ "$(printf '%s\n%s\n' "$LAST" "$IN" | sort -V | tail -1)" != "$IN" ]; then
              echo "::error::الإصدار $IN ليس أكبر من آخر وسم v$LAST"; exit 1
            fi
            echo "version=$IN" >> "$GITHUB_OUTPUT"
            echo "tag=v$IN" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
            echo "release v$IN (last tag: v$LAST)"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: node prepare-web.js

      - name: Add Android platform
        run: npx cap add android

      - name: Configure version (versionCode/versionName + app.js APP_VERSION)
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: node configure-version.js

      - name: Verify app version source
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: node test/app-version-test.mjs

      - name: Prepare web assets (with release version)
        run: node prepare-web.js

      - name: Sync web assets
        run: npx cap sync android

      - name: Generate app icons & splash
        run: npx @capacitor/assets generate --android

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. Add the signing secrets to GitHub, then push the tag again."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
          node configure-signing.js

      - name: Configure install permission (APK self-update via system installer)
        run: node configure-install-permission.js

      - name: Build release APK (signed, for direct download)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/asalh-najd-${{ steps.ver.outputs.version }}.apk"

      - name: Build release AAB (Play Store)
        run: |
          cd android
          ./gradlew bundleRelease
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          mv "$AAB" "app/build/outputs/bundle/release/asalh-najd-${{ steps.ver.outputs.version }}.aab"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: majlis-apk
          path: android/app/build/outputs/apk/release/asalh-najd-${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: majlis-aab
          path: android/app/build/outputs/bundle/release/asalh-najd-${{ steps.ver.outputs.version }}.aab
          if-no-files-found: warn

      # الوسم يُنشأ بعد نجاح البناء فقط: بناء فاشل لا يترك وسماً بلا APK
      - name: Create release tag (manual release)
        if: steps.ver.outputs.create_tag == 'true'
        run: |
          git tag "${{ steps.ver.outputs.tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ steps.ver.outputs.tag }}"

      - name: Delete old release
        if: steps.ver.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ steps.ver.outputs.tag }}" --yes 2>/dev/null || true

      - name: Create GitHub Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            android/app/build/outputs/apk/release/asalh-najd-${{ steps.ver.outputs.version }}.apk
            android/app/build/outputs/bundle/release/asalh-najd-${{ steps.ver.outputs.version }}.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
