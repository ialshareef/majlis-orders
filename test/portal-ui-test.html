<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal UI Tests</title>
</head>
<body>
<iframe id="f" src="/portal.html" style="height:900px;border:1px solid #999"></iframe>
<div id="testResult">RUNNING</div>
<pre id="testLog"></pre>
<script>
/* واجهة البوابة بعرض CSS حقيقي (iframe بعرض ثابت ?w=). بدون backend:
   تتحقق من التدهور السليم + التخطيط + المقاسات. */
window.TEST_ERRORS = [];
window.addEventListener('error', function (e) { window.TEST_ERRORS.push('onerror: ' + (e.message || e.type)); });
window.addEventListener('unhandledrejection', function (e) { window.TEST_ERRORS.push('rejection: ' + ((e.reason && (e.reason.message || e.reason)) || e.type)); });
(function () {
  var W = Number(new URLSearchParams(location.search).get('w')) || 360;
  document.getElementById('f').style.width = W + 'px';
  var log = function (m) { document.getElementById('testLog').textContent += m + '\n'; };
  var n = 0, bad = 0;
  var t = function (name, cond, why) {
    n++; if (cond) log('PASS U' + n + ' ' + name);
    else { bad++; log('FAIL U' + n + ' ' + name + (why ? ' :: ' + why : '')); }
  };
  var waitFor = function (cond, ms) {
    ms = ms || 30000; var t0 = Date.now();
    return new Promise(function (res, rej) {
      (function poll() {
        var v = null; try { v = cond(); } catch (e) { /* retry */ }
        if (v) return res(v);
        if (Date.now() - t0 > ms) return rej(new Error('timeout'));
        setTimeout(poll, 100);
      })();
    });
  };
  var get = function (p) { return fetch(p, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + p); return r.text(); }); };

  (async function run() {
    try {
      var frame = document.getElementById('f');
      await waitFor(function () {
        try { return frame.contentDocument && frame.contentDocument.querySelector('#pShopName'); }
        catch (e) { return false; }
      });
      await new Promise(function (r) { setTimeout(r, 2500); });
      var doc = frame.contentDocument;
      var w = frame.contentWindow;
      var vw = w.innerWidth;
      t('width', vw === W, 'vw=' + vw + ' want=' + W);
      var q = function (s) { return doc.querySelector(s); };
      // الترحيب يعمل بلا backend
      t('landing', !q('#pLanding').hidden && q('#pShopName').textContent.length > 0, 'landing');
      t('start-btn', !!q('#pStart') && q('#pStart').textContent.indexOf('ابدأ') >= 0, 'start');
      var links = ['plMaps', 'plTiktok', 'plInsta', 'plSnap', 'plWa', 'plPhone'];
      t('links-present', links.every(function (id) { return !!doc.getElementById(id); }), '6 links');
      t('links-safe', links.every(function (id) {
        var a = doc.getElementById(id);
        var hidden = a.style.display === 'none' || getComputedStyle(a).display === 'none';
        if (hidden) return true;
        var h = a.getAttribute('href') || '';
        return h.indexOf('https://') === 0 || h.indexOf('tel:') === 0;
      }), 'hrefs');
      // لا تجاوز أفقي
      t('no-overflow', doc.documentElement.scrollWidth <= vw + 1, 'doc=' + doc.documentElement.scrollWidth);
      // أزرار ≥44
      var small = [];
      doc.querySelectorAll('#pLanding button, #pLanding .p-link').forEach(function (el) {
        if (getComputedStyle(el).display === 'none') return;
        var r = el.getBoundingClientRect();
        if (r.width > 0 && (r.height < 44 || r.width < 44)) small.push((el.id || el.className) + ':' + Math.round(r.width) + 'x' + Math.round(r.height));
      });
      t('touch-44', small.length === 0, small.slice(0, 5).join('|'));
      // هيكل المصمم موجود ومخفي
      t('wizard-dom', !!q('#pSteps') && !!q('#pCanvas') && !!q('#pPanel') && !!q('#pSheet') && !!q('.p-zoombar'), 'wizard');
      // خمس مراحل مسماة + لا شباك في واجهة العميل
      var css = await get('/css/style.css');
      var ph0 = await get('/portal.html');
      t('steps-5', (ph0.match(/data-step=/g) || []).length === 0, 'steps built by JS');
      var pjs0 = await get('/js/portal.js');
      var stepIds = (pjs0.match(/id: '(room|openings|majlis|furn|review)'/g) || []).length;
      t('steps-named', stepIds === 5 && pjs0.indexOf('الأثاث والإكسسوارات') >= 0, '5 named steps');
      t('steps-arch', pjs0.indexOf("label: 'العناصر المعمارية'") >= 0 && pjs0.indexOf("label: 'الفتحات'") < 0, 'arch label');
      t('steps-equal-grid', css.indexOf('.p-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));') >= 0
        && css.indexOf('.p-steps button i {') >= 0
        && /\.p-steps button \{[^}]*width: 100%;/.test(css), 'equal-width steps, number pinned');
      t('room-live', pjs0.indexOf('pfRect') < 0 && pjs0.indexOf('liveDim') >= 0 && pjs0.indexOf('تطبيق كغرفة مستطيلة') < 0, 'no apply button');
      t('no-window-add', ph0.indexOf('شباك') < 0 && pjs0.indexOf("data-t=\"window\"") < 0 && pjs0.indexOf("<option value=\"window\"") < 0, 'no window add UI');
      t('no-global-toolbar', ph0.indexOf('id="pTools"') < 0 && ph0.indexOf('id="pReview"') < 0, 'no toolbar/review view');
      t('zoom-outside', ph0.indexOf('p-zoombar') >= 0 && ph0.indexOf('zoom-ctl') < 0, 'zoom outside canvas');
      // واجهة مُبسّطة: زر «التالي» كـ Layout، ولا قوائم أطوال جدران
      t('nav-next', ph0.indexOf('id="pNextStep"') >= 0 && ph0.indexOf('id="pPrevStep"') >= 0, 'next/prev buttons');
      t('nav-bar-css', /\.portal #pDesign \{[^}]*overflow: hidden/.test(css)
        && /\.portal #pDesign \.p-canvas-col \{[^}]*overflow: hidden/.test(css), 'one-screen layout');
      t('room-simple', pjs0.indexOf('عرض الغرفة') >= 0 && pjs0.indexOf('طول الغرفة') >= 0
        && pjs0.indexOf("id=\"pfAddWall\"") < 0 && pjs0.indexOf('id="pfWalls"') < 0
        && pjs0.indexOf('data-walldel') < 0, 'room = w+l only');
      t('arch-simple', pjs0.indexOf('تغيير الجدار') < 0 && pjs0.indexOf('أين تريد الباب والمشب') >= 0, 'wall picker wording');
      t('seat-cards', pjs0.indexOf('SEAT_HELP') >= 0 && pjs0.indexOf('data-seat=') >= 0
        && pjs0.indexOf('يوزّع الفرش تلقائيًا') >= 0, 'seating explained + auto-fill explained');
      t('review-desc', pjs0.indexOf('p-actrow') >= 0 && pjs0.indexOf('p-review-note') >= 0
        && pjs0.indexOf('معاينة: شاهد التصميم قبل الإنهاء') >= 0, 'review actions explained');
      // العمود غير معروض كخيار في واجهة العميل (يبقى في تطبيق الموظفين)
      t('column-ui', pjs0.indexOf("data-add=\"column\"") < 0 && pjs0.indexOf('data-coldel') < 0, 'no column option');
      // محرر الفتحات المدمج: سطر واحد + steppers، وبلا زر حذف عريض
      t('op-compact', pjs0.indexOf('opsheet') >= 0 && pjs0.indexOf('data-owminus') >= 0 && pjs0.indexOf('data-owplus') >= 0 && pjs0.indexOf('data-compact') >= 0, 'compact sheet');
      t('op-panel-stepper', pjs0.indexOf('data-opwminus') >= 0 && pjs0.indexOf('data-opwplus') >= 0 && pjs0.indexOf('data-opw="') >= 0, 'panel steppers');
      t('op-no-blockdel', pjs0.indexOf('btn block danger" data-del>') < 0, 'no block delete in portal sheet');
      t('qty-ui', pjs0.indexOf('psQty') >= 0 && pjs0.indexOf('p-qty') >= 0, 'qty');
      t('review-step', pjs0.indexOf('renderReviewPanel') >= 0 && pjs0.indexOf('pActPdf') >= 0 && pjs0.indexOf('pActWa') >= 0, 'review actions');
      t('done-dom', !!q('#pDesignNo') && !!q('#pPdf') && !!q('#pShareWa') && !!q('#pContactBtn'), 'done');
      t('look-dom', !!q('#pLookNo') && !!q('#pLookImg'), 'look');
      // ترويسة PDF: أيقونة التطبيق صورة حقيقية (لا SVG يُرسم أسود عند التصدير)
      t('pdf-app-icon', pjs0.indexOf('inv-mark') >= 0 && pjs0.indexOf('/icons/icon-512.png') >= 0, 'pdf uses app icon image');
      // رقم التصميم مرة واحدة فقط: في خانة التاريخ المجاورة، لا في الترويسة ولا مكرّرًا
      var infoBlock = (pjs0.match(/<div class="inv-info">[\s\S]*?inv-foot/) || [''])[0];
      t('pdf-no-once', (pjs0.match(/class="inv-no"/g) || []).length === 0
        && pjs0.indexOf('<small>تصميم مجلس — ') < 0
        && (infoBlock.match(/<span>رقم التصميم<\/span>/g) || []).length === 1, 'design number appears once');
      // تواصل معنا: بطاقات أيقونة + باركود لكل قناة، لا سطور نص عشوائية
      t('pdf-contact-cards', pjs0.indexOf('inv-chans') >= 0 && pjs0.indexOf('inv-chan-qr') >= 0
        && pjs0.indexOf('contactLines') < 0 && pjs0.indexOf('wa.me/') >= 0, 'contact channel cards');
      t('pdf-contact-icons', css.indexOf('.inv-chan-qr {') >= 0 && css.indexOf('.inv-chan-ic.wa {') >= 0
        && css.indexOf('.inv-chan-ic.in {') >= 0 && css.indexOf('.inv-chan-ic.tt {') >= 0
        && css.indexOf('.inv-chan-ic.map {') >= 0, 'channel icon styles');
      // الأيقونات والباركود روابط حقيقية داخل ملف PDF
      t('pdf-links', pjs0.indexOf('function addPdfLinks') >= 0 && pjs0.indexOf('pdf.link(') >= 0
        && pjs0.indexOf('data-url') >= 0, 'clickable pdf links');
      // لا باركود تصميم جانبي في أسفل الصفحة (كان يُقصّ ويشوّه الترويسة)
      t('pdf-no-extra-qr', pjs0.indexOf('امسح لعرض التصميم') < 0 && pjs0.indexOf('customer-design/view/') < 0,
        'design qr removed');
      // ملاحظة واضحة وسط فوق الأيقونات: «اضغط على الباركود»
      t('pdf-qr-hint', pjs0.indexOf('inv-chans-hint') >= 0 && pjs0.indexOf('اضغط على الباركود') >= 0
        && /\.inv-chans-hint \{[^}]*text-align: center/.test(css), 'hint above icons');
      // RTL + viewport
      t('rtl', doc.documentElement.dir === 'rtl' && doc.documentElement.lang === 'ar', 'dir');
      // صياغة portal.js + designer.js
      var pjs = await get('/js/portal.js');
      try { new Function(pjs); t('portal-syntax', true); }
      catch (e) { t('portal-syntax', false, String(e.message).slice(0, 150)); }
      // شريط الموظفين: صفّان وكل الأدوات
      var idx = await get('/index.html');
      var tbIds = ['tbAddSofa', 'tbAddDoor', 'tbAddWindow', 'tbAddMashab', 'tbAddWall', 'tbAddSofaFree', 'tbFillAll'];
      t('toolbar-ids', tbIds.every(function (id) { return idx.indexOf('id="' + id + '"') >= 0; }), '7 tools');
      t('toolbar-rows', (idx.match(/class="tb-row"/g) || []).length === 2, 'two rows');
      t('toolbar-css', css.indexOf('.tb-insert .tb-row') >= 0 && css.indexOf('.tb-insert .tb-btn span { font-size: .76rem') < 0, 'row css, no shrink');
      // About: المطوران
      t('about-devs', idx.indexOf('Fawaz Al-sharif') >= 0 && idx.indexOf('Khaled Al Qaini') >= 0 && idx.indexOf('khaledalqaini@gmail.com') >= 0, 'devs');
      // بوابة العميل في الـ worker bundle لاحقاً: portal.html تُخدم (فحص ثابت هنا لوجود الملف)
      var ph = await get('/portal.html');
      t('portal-file', ph.indexOf('pLanding') >= 0 && ph.indexOf('/js/portal.js') >= 0, 'portal.html');
      // إعدادات التسويق في واجهة المدير (ثابت: الحقول + التطبيع)
      var appjs = await get('/js/app.js');
      t('settings-fields', ['sTagline', 'sLogo', 'sMaps', 'sWa', 'sIg', 'sTik', 'sSnap'].every(function (id) { return appjs.indexOf(id) >= 0; }), 'fields');
      t('settings-norm', appjs.indexOf('wa.me') >= 0 && appjs.indexOf('بوابة العميل والتسويق') >= 0, 'normalize');
    } catch (e) {
      bad++; log('FAIL harness :: ' + (e.message || e));
    } finally {
      if (window.TEST_ERRORS.length) { bad++; log('WINDOW ERRORS: ' + window.TEST_ERRORS.join(' | ')); }
      var verdict = bad === 0 ? ('PASS ' + n + '/' + n) : 'FAIL';
      document.getElementById('testResult').textContent = verdict;
      document.title = verdict;
      log('---- ' + verdict + ' W=' + W + ' ----');
    }
  })();
})();
</script>
</body>
</html>
