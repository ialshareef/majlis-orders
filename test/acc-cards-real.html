<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>acc cards — real source audit</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/portal-expanded.css">
<style>#rep{position:fixed;inset:0;background:#fff;z-index:99999;overflow:auto;font:11px/1.6 monospace;padding:8px;direction:ltr;text-align:left}</style>
</head><body>
<pre id="rep">…</pre>
<script>
/* فحص الكود الحقيقي (portal-expanded.js + CSS) لا المحاكاة.
   العيوب التي عالجناها كانت بالضبط في هذين الملفين. */
const T={pass:0,fail:0,lines:[]};
function t(n,ok,i){(ok?T.pass++:T.fail++);T.lines.push((ok?'PASS  ':'FAIL  ')+n+(i?'  ['+i+']':''));}
function flush(){document.getElementById('rep').textContent='PASS='+T.pass+'  FAIL='+T.fail+'\n\n'+T.lines.join('\n');}

(async function(){
 try{
  const src  = await (await fetch('/js/portal-expanded.js')).text();
  const css  = await (await fetch('/css/portal-expanded.css')).text();

  /* 1) العطل الجذري: querySelector المفرد مستعمل مع forEach/map/length */
  const single = src.split('\n').filter(function (l) {
    let i = l.indexOf("$('");
    if (i < 0) return false;
    if (l.charAt(i - 1) === '$') return false;      // $$ = querySelectorAll، صح
    while (i >= 0 && /\)\.(forEach|map)\(|\)\.length/.test(l.slice(i))) return true;
    return false;
  });
  t('لا $ المفرد مع forEach/map/length', single.length === 0, single.slice(0, 3).join(' | '));

  t('input اليدوي يستعمل $$',     src.indexOf("$$('input[data-qtyin]'") >= 0);
  t('بلا أزرار +/- للكمية (الحقل المباشر بديل كامل)', src.indexOf("button[data-qtyplus]") < 0 && src.indexOf("button[data-qtyminus]") < 0 && src.indexOf('data-qtyminus') < 0 && src.indexOf('data-qtyplus') < 0);
  t('زر الحذف يستعمل $$',         src.indexOf("$$('button[data-qtydel]'") >= 0);
  t('زر «تم» يستعمل $$',          src.indexOf("$$('button[data-qtyok]'") >= 0);
  t('بطاقات فتح اللوحة تستعمل $$', src.indexOf("$$('[data-accwrap]'") >= 0);

  /* 2) blur لا يعيد البناء: كان يقتل اللوحة ويبتلع نقرة «تم»/الحذف */
  t('blur محمي بـ relatedTarget', /relatedTarget[\s\S]{0,120}contains\(e\.relatedTarget\)/.test(src));
  t('syncTile معرّفة',            /function syncTile\(id\)/.test(src));
  t('commit تستعمل syncTile',     /var commit = function[\s\S]{0,900}syncTile\(id\)/.test(src));
  t('syncTile تحترم الحقل المُركَّز', /syncTile[\s\S]{0,600}document\.activeElement\s*!==\s*inp/.test(src));

  /* 3) الشبكة: عمودان متساويان */
  t('.px-accgrid عمودان متساويان',
    /\.px-accgrid \{[^}]*grid-template-columns: repeat\(2, minmax\(0, 1fr\)\)/.test(css));
  t('لا auto-fill على px-accgrid', !/\.px-accgrid[^}]*auto-fill/.test(css));
  const base = css.indexOf('.px-accgrid {');
  const pre  = css.slice(0, base);
  t('لا 3 أعمدة قبل القاعدة الأساسية', !/\.px-accgrid[^}]*repeat\(3,/.test(pre));
  t('صنفان في كل صف على كل المقاسات',
    (css.match(/\.px-accgrid \{[^}]*repeat\(2, minmax\(0, 1fr\)\)/g) || []).length === 1 &&
    !/@media[^{]*\{[^}]*\.px-accgrid \{[^}]*repeat\([34]/.test(css));

  /* 4) لا قواعد قديمة تهزم الجديدة */
  t('لا .px-acc min-height قبل الكتلة',
    !/\.px-acc \{ min-height: 96px; \}/.test(pre));
  t('لا .px-qtybar .qbtn ارتفاع قديم',
    !/\.px-qtybar \.qbtn, \.px-qtyval/.test(css));

  /* 5) لوحة الكمية: 3 أعمدة داخلية */
  t('.px-qtybar ثلاثية الأعمدة',
    /\.px-qtybar \{[\s\S]{0,400}grid-template-columns: 34px minmax\(0, 1fr\) 34px/.test(css));
  t('.px-qtybar صفّان 34px (لمس مريح)',
    /\.px-qtybar \{[\s\S]{0,300}grid-template-rows: 34px 34px/.test(css));
  t('.px-qdone يمتد على عمودين', /\.px-qdone \{[\s\S]{0,160}grid-column: 1 \/ 3/.test(css));
  t('.px-qtybar hidden لا يحجز مساحة', /\.px-qtybar\[hidden\][^}]*display:\s*none\s*!important/.test(css));
  t('.px-accgrid يساوي الارتفاعات', /\.px-accgrid \{[^}]*align-items:\s*stretch/.test(css));

  /* 6) سلامة النصوص */
  t('لا محرف تالف في CSS', css.indexOf('\uFFFD') < 0);
  t('لا محرف تالف في JS', src.indexOf('\uFFFD') < 0);
  t('لا console.log في الكود', !/console\.log\(/.test(src));

 } catch (e) { t('اكتمل التنفيذ', false, e.message); }
 flush();
})();
</script></body></html>
