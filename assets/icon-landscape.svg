<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="54" y1="32" x2="448" y2="492" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24384A"/>
      <stop offset="1" stop-color="#101D2B"/>
    </linearGradient>
    <linearGradient id="rug" x1="175" y1="96" x2="337" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A83D3B"/>
      <stop offset="1" stop-color="#70272F"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F5E7C9"/>
      <stop offset="1" stop-color="#D7B982"/>
    </linearGradient>
    <filter id="shadow" x="35" y="32" width="442" height="448" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#07111B" flood-opacity=".34"/>
    </filter>
  </defs><g transform="rotate(90 256 256)">

  <!-- Deep indigo field and a restrained brass frame -->
  <g filter="url(#shadow)">
    <rect x="40" y="36" width="432" height="432" rx="104" fill="url(#bg)"/>
    <rect x="53" y="49" width="406" height="406" rx="92" stroke="#C7A66B" stroke-opacity=".9" stroke-width="3"/>
    <rect x="64" y="60" width="384" height="384" rx="82" stroke="#E4D1A8" stroke-opacity=".18" stroke-width="2"/>
  </g>

  <!-- Room outline: a simple floor-plan cue -->
  <path d="M108 121V387Q108 404 125 404H387Q404 404 404 387V121" stroke="#E4D1A8" stroke-opacity=".38" stroke-width="3" stroke-linecap="round"/>

  <!-- Persian-inspired rug: double border, corner rosettes, and central medallion -->
  <rect x="176" y="91" width="160" height="330" rx="25" fill="url(#rug)" stroke="#E0C17F" stroke-width="5"/>
  <rect x="188" y="103" width="136" height="306" rx="18" stroke="#F0D99E" stroke-width="2.5"/>
  <rect x="197" y="112" width="118" height="288" rx="14" stroke="#D99A62" stroke-width="2" stroke-dasharray="3 7"/>

  <!-- Repeating carpet diamonds -->
  <g fill="#F0D99E" stroke="#6F2630" stroke-width="2">
    <path d="M256 126l10 12-10 12-10-12 10-12Z"/><path d="M256 362l10 12-10 12-10-12 10-12Z"/>
    <path d="M207 181l8 9-8 9-8-9 8-9Z"/><path d="M305 181l8 9-8 9-8-9 8-9Z"/>
    <path d="M207 307l8 9-8 9-8-9 8-9Z"/><path d="M305 307l8 9-8 9-8-9 8-9Z"/>
  </g>
  <g fill="#E7B66D">
    <circle cx="256" cy="162" r="3.5"/><circle cx="256" cy="344" r="3.5"/>
    <circle cx="211" cy="217" r="3.5"/><circle cx="301" cy="217" r="3.5"/>
    <circle cx="211" cy="281" r="3.5"/><circle cx="301" cy="281" r="3.5"/>
  </g>

  <!-- Rug medallion, kept bold enough to read at launcher size -->
  <path d="M256 191c17 14 27 31 27 52s-10 38-27 52c-17-14-27-31-27-52s10-38 27-52Z" fill="#D5A85F" stroke="#F0D99E" stroke-width="3"/>
  <path d="M256 204c10 11 16 24 16 39s-6 28-16 39c-10-11-16-24-16-39s6-28 16-39Z" fill="#8B3036" stroke="#F0D99E" stroke-width="2"/>
  <path d="M256 219l12 24-12 24-12-24 12-24Z" fill="#F0D99E"/>
  <circle cx="256" cy="243" r="5" fill="#D5A85F"/>

  <!-- Top-down majlis seating: paired cushions frame the rug -->
  <g stroke="#A88655" stroke-width="2.5" stroke-linejoin="round">
    <rect x="94" y="153" width="60" height="206" rx="24" fill="url(#cushion)"/>
    <rect x="358" y="153" width="60" height="206" rx="24" fill="url(#cushion)"/>
    <rect x="103" y="165" width="42" height="54" rx="15" fill="#E9D6B2"/>
    <rect x="103" y="229" width="42" height="54" rx="15" fill="#E9D6B2"/>
    <rect x="103" y="293" width="42" height="54" rx="15" fill="#E9D6B2"/>
    <rect x="367" y="165" width="42" height="54" rx="15" fill="#E9D6B2"/>
    <rect x="367" y="229" width="42" height="54" rx="15" fill="#E9D6B2"/>
    <rect x="367" y="293" width="42" height="54" rx="15" fill="#E9D6B2"/>
  </g>

  <!-- Small corner ornaments echo the carpet weaving -->
  <g fill="#D3B273">
    <path d="M126 104l7 7-7 7-7-7 7-7Z"/><path d="M386 104l7 7-7 7-7-7 7-7Z"/>
    <path d="M126 394l7 7-7 7-7-7 7-7Z"/><path d="M386 394l7 7-7 7-7-7 7-7Z"/>
  </g>
</g></svg>