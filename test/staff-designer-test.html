<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Designer Tests</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
</head>
<body>
<iframe id="f" src="about:blank" style="border:1px solid #999"></iframe>
<div id="testResult">RUNNING</div>
<pre id="testLog"></pre>
<script>
/* اختبارات مصمم الموظفين: نفس المحرك المحسّن + صلاحيات + تسعير.
   ?w=320..430 يعيد التشغيل داخل iframe بالعرض المطلوب ويمرر النتيجة. */
window.TEST_ERRORS = [];
window.addEventListener('error', function (e) { window.TEST_ERRORS.push('onerror: ' + (e.message || e.type)); });
window.addEventListener('unhandledrejection', function (e) { window.TEST_ERRORS.push('rejection: ' + ((e.reason && (e.reason.message || e.reason)) || e.type)); });
(function () {
  var qs = new URLSearchParams(location.search);
  var W = Number(qs.get('w')) || 0;
  var ROLE = qs.get('role') || 'staff';
  var INFRAME = qs.has('inframe');
  if (W && !INFRAME) {
    var f = document.getElementById('f');
    f.style.width = W + 'px';
    f.style.height = '900px';
    f.src = location.pathname + '?w=' + W + '&inframe=1&role=' + ROLE;
    var t0 = Date.now();
    (function poll() {
      var verdict = '';
      try {
        var t = f.contentDocument.getElementById('testResult');
        verdict = t ? t.textContent : '';
        var lg = f.contentDocument.getElementById('testLog');
        if (lg && (verdict === 'FAIL' || verdict.indexOf('PASS') === 0)) {
          document.getElementById('testLog').textContent = 'W=' + W + ' ROLE=' + ROLE + '\n' + lg.textContent;
        }
      } catch (e) { /* cross-origin n/a same-origin ok */ }
      if (verdict === 'FAIL' || verdict.indexOf('PASS') === 0) {
        document.getElementById('testResult').textContent = verdict;
        document.title = verdict;
        return;
      }
      if (Date.now() - t0 > 540000) {
        document.getElementById('testResult').textContent = 'FAIL';
        document.title = 'FAIL';
        return;
      }
      setTimeout(poll, 500);
    })();
    return;
  }
  document.getElementById('f').style.display = 'none';
  var log = function (m) { document.getElementById('testLog').textContent += m + '\n'; };
  var n = 0, bad = 0;
  var t = function (name, cond, why) {
    n++; if (cond) log('PASS D' + n + ' ' + name);
    else { bad++; log('FAIL D' + n + ' ' + name + (why ? ' :: ' + why : '')); }
  };
  var stageNo = 0;
  function stage(s) { stageNo = s; try { document.title = 'STAGE' + s; } catch (_) { /* noop */ } }
  var waitFor = function (cond, ms) {
    ms = ms || 120000; var t0 = Date.now();
    return new Promise(function (res, rej) {
      (function poll() {
        var v = null; try { v = cond(); } catch (e) { /* retry */ }
        if (v) return res(v);
        if (Date.now() - t0 > ms) return rej(new Error('timeout'));
        setTimeout(poll, 100);
      })();
    });
  };
  var realFetch = window.fetch.bind(window);
  var get = function (p) { return realFetch(p, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + p); return r.text(); }); };

  async function partA() {
    var parts = await Promise.all([get('../index.html'), get('../css/style.css'), get('../js/app.js'), get('../js/designer.js')]);
    var html = parts[0], css = parts[1], app = parts[2], dz = parts[3];
    // لا تبديل تلقائي بين العرض والطول (كان ينقل الرقم المُدخل إلى الحقل المجاور)
    t('A-no-swap', app.indexOf('if (h > w) { const t = w; w = h; h = t; }') < 0, 'no auto swap');
    t('A-no-clobber', app.indexOf("if (af !== $('#roomW'))") >= 0, 'do not overwrite focused field');
    // 2b) اختيار الجدار من القائمة لا يفتح لوحة الطول (لا سحب للأسفل)
    t('A-nojump', app.indexOf('wallSelNoJump = true;   // لا قفز للأسفل') >= 0, 'wall select no jump');
    // 3) اسم الجدار خارج الغرفة
    t('A-label-off', dz.indexOf('WALL_LABEL_OFF = 0.95') >= 0 && dz.indexOf('WALL_T + WALL_LABEL_OFF') >= 0, 'label outside');
    t('A-col-btn', html.indexOf('id="tbAddColumn"') >= 0, 'toolbar button');
    t('A-col-lock', app.indexOf("'#tbAddColumn'") >= 0 && app.indexOf('#tbAddWall') >= 0, 'lockable');
    t('A-revert', app.indexOf('onRevert') >= 0 && app.indexOf('فوق العامود') >= 0, 'revert toast');
    t('A-zoom', html.indexOf('id="tbZoomPct"') >= 0 && app.indexOf('zoomPct') >= 0, 'zoom pct');
    t('A-qty-step', app.indexOf('data-selminus') >= 0 && app.indexOf('data-selplus') >= 0, 'qty steppers');
    t('A-smart', dz.indexOf('findSpots(w, h, diff') >= 0 || dz.indexOf('findSpots(w, h, n') >= 0, 'smart placement');
    t('A-dup-clamp', dz.indexOf('this._clampToRoom(q, this.geometry())') >= 0, 'dup clamp');
    t('A-warn', app.indexOf('تم وضع ${placed}') >= 0, 'partial warn');
    t('A-terms', app.indexOf("label: 'الخشب'") >= 0 || app.indexOf('الخشب') >= 0, 'staff terms kept');
    t('A-touch', css.indexOf('.zoom-ctl .tb-btn { min-height: 44px') >= 0, '44px');
    t('A-pdf', app.indexOf('buildPrintDoc') >= 0 && app.indexOf('exportCurrent') >= 0, 'pdf path intact');
    t('A-ver', app.indexOf("APP_VERSION = '1.0.37'") >= 0, 'version');
    // 1) لا زر «تطبيق كغرفة مستطيلة»: المقاسات تُطبَّق مباشرة أثناء الكتابة
    t('A-live-dims', app.indexOf('btnApplyRect') < 0 && app.indexOf('applyRoomDims') >= 0
      && app.indexOf("el.addEventListener('input', () => applyRoomDims(true))") >= 0, 'live room dims');
    t('A-live-dims-html', html.indexOf('id="btnApplyRect"') < 0 && html.indexOf('id="roomW"') >= 0
      && html.indexOf('id="roomH"') >= 0, 'no apply button in markup');
    // 2) اختيار الجدار في شريط الأدوات: يحدّد موضع الباب/المشب بلا لمس المخطط
    t('A-wall-tb', html.indexOf('id="wallSelTb"') >= 0 && app.indexOf('wallSelTb') >= 0
      && app.indexOf("tbSel.addEventListener('change'") >= 0, 'wall select in toolbar');
  }

  function b64(bytes) {
    var s = '', b = new Uint8Array(bytes);
    for (var i = 0; i < b.length; i += 4096) s += String.fromCharCode.apply(null, b.subarray(i, i + 4096));
    return btoa(s);
  }
  // بيانات اختبار فقط: تكرارات رمزية (الخادم يحترم العدد المخزن) لتسريع الدخول
  async function testHash(pw) {
    var enc = new TextEncoder();
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: 100 }, key, 256);
    return 'pbkdf2$100$' + b64(salt) + '$' + b64(bits);
  }

  async function partB() {
    var SQL = await initSqlJs({ locateFile: function (f) { return 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/' + f; } });
    stage(10);
    var sqlite = new SQL.Database();
    sqlite.exec(await (await realFetch('../worker/schema.sql')).text());
    stage(11);
    var norm = function (v) { return v === undefined ? null : (typeof v === 'boolean' ? (v ? 1 : 0) : v); };
    var DB = {
      prepare: function (sql) {
        var st = { sql: sql, args: [] };
        st.bind = function () { st.args = Array.prototype.map.call(arguments, norm); return st; };
        st.first = async function () { var s = sqlite.prepare(sql); s.bind(st.args); var has = s.step(); var row = has ? s.getAsObject() : null; s.free(); return row; };
        st.all = async function () { var s = sqlite.prepare(sql); s.bind(st.args); var results = []; while (s.step()) results.push(s.getAsObject()); s.free(); return { results: results, success: true }; };
        st.run = async function () { sqlite.run(sql, st.args); return { success: true }; };
        return st;
      },
      batch: async function (stmts) { var out = []; for (var s of stmts) out.push(await s.run()); return out; },
    };
    var mod = await import('../worker/worker.js');
    stage(12);
    var env = { DB: DB };
    var ORIGIN = 'https://majlis.test';
    var call = function (url, init) { return mod.default.fetch(new Request(url, init), env); };
    window.fetch = async function (input, init) {
      var url = typeof input === 'string' ? input : input.url;
      if (url.indexOf(ORIGIN) === 0) return call(url, init);
      return realFetch(input, init);
    };
    // مستخدمون بكلمات معروفة ورخيصة (بذرة مسبقة تمنع ensureSeed + بوابة admin/admin)
    var hpw = await testHash('test1234');
    sqlite.run("INSERT INTO users (id, username, name, password_hash, role, active, created_at) VALUES ('u-admin','admin','مدير','" + hpw + "','admin',1,'2026-01-01')");
    sqlite.run("INSERT INTO users (id, username, name, password_hash, role, active, created_at) VALUES ('u-staff','sara','سارة','" + hpw + "','staff',1,'2026-01-01')");
    sqlite.run("INSERT INTO users (id, username, name, password_hash, role, active, created_at) VALUES ('u-mand','mand1','مندوب','" + hpw + "','mandoub',1,'2026-01-01')");
    var html = await (await realFetch('../index.html')).text();
    var doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script').forEach(function (s) { s.remove(); });
    var wrap = document.createElement('div');
    wrap.innerHTML = doc.body.innerHTML;
    document.body.appendChild(wrap);
    window.APP_CONFIG = { apiUrl: ORIGIN };
    (function () {
      var si = window.setInterval.bind(window);
      window.setInterval = function (fn, ms) { if (Number(ms) === 30000) return 0; return si(fn, ms); };
    })();
    for (var p of ['../js/store.js', '../js/designer.js', '../js/update.js', '../js/app.js']) {
      var s = document.createElement('script');
      s.textContent = await (await realFetch(p)).text();
      document.body.appendChild(s);
    }
    await waitFor(function () { return window.MajlisApp && document.querySelector('#loginForm'); }, 240000);
    stage(13);
    var creds = ROLE === 'admin' ? ['admin', 'test1234'] : (ROLE === 'staff' ? ['sara', 'test1234'] : ['mand1', 'test1234']);
    document.querySelector('#loginUser').value = creds[0];
    document.querySelector('#loginPass').value = creds[1];
    document.querySelector('#loginForm button[type=submit]').click();
    stage(14);
    await waitFor(function () { return !document.querySelector('#app').hidden; }, 240000);
    t('B-login-' + ROLE, true);
    stage(1);
    log('partB: MARK app-visible');
    log('partB: MARK entered');
    if (ROLE !== 'admin') {
      var usersBtn = document.querySelector('#mainNav button[data-page="users"]');
      t('B-admin-hidden', usersBtn && usersBtn.hidden, 'admin nav hidden');
      document.querySelector('#mainNav button[data-page="users"]').click();
      await new Promise(function (r) { setTimeout(r, 1000); });
      t('B-admin-bounce', !document.querySelector('#page-users').classList.contains('active'), 'bounced');
      var cv = document.querySelector('#designCanvas');
      t('B-designer-present', !!cv, 'canvas exists');
      window.fetch = realFetch;
      return;
    }
    // مسار المدير الكامل
    document.querySelector('button[data-page="order"]').click();
    await waitFor(function () { return document.querySelector('#page-order').classList.contains('active'); });
    log('partB: MARK order-page');
    stage(2);
    var dz = window.MajlisApp.designer;
    dz.setRect(5, 4);
    log('partB: MARK rect');
    stage(3);
    var q = function (sel) { return document.querySelector(sel); };
    var qAll = function (sel) { return Array.from(document.querySelectorAll(sel)); };
    // 1) حيّ: الكتابة في حقل المقاس تعيد رسم الغرفة فورًا (بلا زر)
    dz.setRect(5, 4);
    var wIn = q('#roomW'), hIn = q('#roomH');
    var l0 = dz.state.walls[0].len;
    wIn.value = '7';
    wIn.dispatchEvent(new Event('input', { bubbles: true }));
    var l1 = dz.state.walls[0].len;
    t('B-live-w', Math.abs(l1 - 7) < 0.01 && Math.abs(l0 - 5) < 0.01, l0 + '->' + l1);
    hIn.value = '3';
    hIn.dispatchEvent(new Event('input', { bubbles: true }));
    t('B-live-h', Math.abs(dz.state.walls[1].len - 3) < 0.01, String(dz.state.walls[1].len));
    t('B-live-closed', dz.geometry().closed, 'room still closed');
    // 2) حيّ: اختيار الجدار من الشريط يحدّد موضع الباب التالي
    var tbSel = q('#wallSelTb');
    var opts = tbSel ? Array.from(tbSel.options).map(function (o) { return o.textContent; }) : [];
    var nWalls = dz.state.walls.length;
    if (tbSel && nWalls > 1) {
      tbSel.value = String(nWalls - 1);
      tbSel.dispatchEvent(new Event('change', { bubbles: true }));
      t('B-wall-tb-sel', dz.selectedWallIndex() === nWalls - 1, 'wall ' + dz.selectedWallIndex());
      q('#tbAddDoor').click();
      await waitFor(function () { return dz.state.openings.some(function (o) { return o.type === 'door'; }); }, 60000);
      var door = dz.state.openings.filter(function (o) { return o.type === 'door'; })[0];
      t('B-wall-tb-door', door && door.wall === nWalls - 1, 'door wall=' + (door && door.wall));
    } else {
      t('B-wall-tb-sel', false, 'no wallSelTb');
      t('B-wall-tb-door', false, 'skipped');
    }
    t('B-wall-opts', opts.length === nWalls && /جدار 1/.test(opts[0] || ''), opts.join('|'));
    // 2b) اختيار الجدار من الشريط لا يفتح لوحة الطول ولا يركّز (لا سحب للأسفل)
    q('#tbAddSofa').click();
    await new Promise(function (r) { setTimeout(r, 700); });
    t('B-wall-nojump', document.activeElement !== q('#wallInlineLen') && q('#wallInlineEdit').hidden,
      'active=' + (document.activeElement && document.activeElement.id) + ' hidden=' + q('#wallInlineEdit').hidden);
    // 3) اسم الجدار يُرسم خارج الغرفة (يبعد عن الباب/المشب)
    var g0 = dz.geometry();
    var lp = dz.wallLabelPos(0);
    var w0 = g0.walls[0];
    var rp = dz.toRoom(lp.x, lp.y);
    var dot = (rp.x - w0.mid.x) * w0.n.x + (rp.y - w0.mid.y) * w0.n.y;   // سالب = خارج
    var dist = Math.hypot(rp.x - w0.mid.x, rp.y - w0.mid.y);
    t('B-label-out', dot < 0 && dist >= 1.0, 'dot=' + dot.toFixed(2) + ' d=' + dist.toFixed(2));
    dz.setRect(5, 4);
    dz.setRect(5, 4);;
    // B: إضافة عامود بزر الشريط
    q('#tbAddColumn').click();
    await waitFor(function () { return dz.state.pieces.some(function (x) { return x.kind === 'column'; }); }, 120000);
    var col = dz.state.pieces.filter(function (x) { return x.kind === 'column'; })[0];
    var bb = dz.geometry().bb;
    t('B-col-add', col.x >= bb.minX && col.x <= bb.maxX, 'column inside');
    // B: كنبة + إكسسوار للمقارنة
    var sp = dz.addSofaOnWall(0, { depth: 0.8 });
    t('B-sofa-add', !!sp, 'sofa placed');
    dz.addAccessory({ id: 'acc-marka', w: 0.6, h: 0.35, shape: 'rect' });
    var acc0 = dz.state.pieces.filter(function (x) { return x.kind === 'acc'; });
    t('B-acc-add', acc0.length === 1, 'one acc');
    // B: تحريك مقيد
    dz.select({ type: 'piece', id: acc0[0].id });
    dz.moveSelected(100, 100);
    var mv = dz.state.pieces.filter(function (x) { return x.id === acc0[0].id; })[0];
    t('B-move-clamp', mv.x <= bb.maxX && mv.y <= bb.maxY, 'clamped');
    // B: ارتداد عن العامود بسحب حقيقي
    var cv2 = document.querySelector('#designCanvas');
    dz.fitView();
    var rect = cv2.getBoundingClientRect();
    var toClient = function (x, y) { var s = dz.toScreen(x, y); return { x: rect.left + s.x, y: rect.top + s.y }; };
    var pe = function (type, cx, cy) {
      return new PointerEvent(type, { bubbles: true, cancelable: true, clientX: cx, clientY: cy, button: 0, pointerId: 1, pointerType: 'mouse', isPrimary: true });
    };
    var ox = mv.x, oy = mv.y;
    var s0 = toClient(ox, oy), s1 = toClient(col.x, col.y);
    cv2.dispatchEvent(pe('pointerdown', s0.x, s0.y));
    var midX = (s0.x + s1.x) / 2, midY = (s0.y + s1.y) / 2;
    cv2.dispatchEvent(pe('pointermove', midX, midY));
    var midPos = dz.state.pieces.filter(function (x) { return x.id === acc0[0].id; })[0];
    log('drag-mid moved=' + (Math.abs(midPos.x - ox) > 0.05 || Math.abs(midPos.y - oy) > 0.05));
    cv2.dispatchEvent(pe('pointermove', s1.x, s1.y));
    cv2.dispatchEvent(pe('pointerup', s1.x, s1.y));
    var mvEnd = dz.state.pieces.filter(function (x) { return x.id === acc0[0].id; })[0];
    t('B-revert', Math.abs(mvEnd.x - ox) < 0.05 && Math.abs(mvEnd.y - oy) < 0.05, 'reverted');
    t('B-revert-toast', document.querySelector('#toast').textContent.indexOf('العامود') >= 0, 'toast');
    // B: تدوير/نسخ/حذف من الورقة
    dz.select({ type: 'piece', id: acc0[0].id });
    var eb = document.querySelector('#tbEdit');
    eb.disabled = false;
    eb.click();
    await waitFor(function () { return !document.querySelector('#inspector').hidden; }, 120000);
    var rot0 = acc0[0].rot || 0;
    document.querySelector('#inspector [data-act="rot"]').click();
    await waitFor(function () {
      var cur = dz.state.pieces.filter(function (x) { return x.id === acc0[0].id; })[0];
      return cur && cur.rot !== rot0;
    }, 120000);
    t('B-rotate', true);
    var nDup = dz.state.pieces.length;
    document.querySelector('#inspector [data-act="dup"]').click();
    await waitFor(function () { return dz.state.pieces.length === nDup + 1; }, 120000);
    var dupPiece = dz.state.pieces[dz.state.pieces.length - 1];
    var dbb = dz.geometry().bb;
    t('B-dup', dupPiece.x <= dbb.maxX && dupPiece.y <= dbb.maxY, 'dup inside');
    document.querySelector('#inspector [data-act="del"]').click();
    await waitFor(function () { return dz.state.pieces.filter(function (x) { return x.id === dupPiece.id; }).length === 0; }, 120000);
    t('B-delete', true);
    // B: كمية حقيقية + تحذير جزئي
    dz.select({ type: 'piece', id: acc0[0].id });
    await waitFor(function () { return document.querySelector('#inspector #selQty'); }, 120000);
    var qinp = document.querySelector('#inspector #selQty');
    qinp.value = '5';
    qinp.dispatchEvent(new Event('change', { bubbles: true }));
    await waitFor(function () { return dz.state.pieces.filter(function (x) { return x.kind === 'acc' && x.itemId === 'acc-marka'; }).length === 5; }, 120000);
    t('B-qty5', true);
    document.querySelector('#inspector [data-selplus]').click();
    await waitFor(function () {
      return dz.state.pieces.filter(function (x) { return x.kind === 'acc' && x.itemId === 'acc-marka'; }).length === 6;
    }, 120000);
    t('B-qty-plus', true);
    document.querySelector('#inspector [data-selminus]').click();
    await waitFor(function () {
      return dz.state.pieces.filter(function (x) { return x.kind === 'acc' && x.itemId === 'acc-marka'; }).length === 5;
    }, 120000);
    t('B-qty-minus', true);
    // B: زوم بالنسبة
    document.querySelector('#tbZoomIn').click();
    await waitFor(function () { return document.querySelector('#tbZoomPct').textContent !== '100%'; }, 60000);
    t('B-zoom-pct', true);
    document.querySelector('#tbZoomPct').click();
    await waitFor(function () { return document.querySelector('#tbZoomPct').textContent === '100%'; }, 60000);
    t('B-zoom-fit', true);
    // E: شريط إجراءات مباشر أسفل المخطط + زوم أسفل + مسافات حية (بلا بوابة خصائص)
    var cWrap = document.querySelector('.canvas-wrap');
    var zCtl = document.querySelector('.zoom-ctl');
    var sBar = document.querySelector('#selBar');
    var insp = document.querySelector('#inspector');
    t('E-zoom-below', !!(cWrap && zCtl && sBar) && zCtl.previousElementSibling === cWrap &&
      sBar.previousElementSibling === zCtl && getComputedStyle(zCtl).position === 'static', 'dom order+static');
    t('E-ptabs-wrap', getComputedStyle(document.querySelector('.ptabs')).flexWrap === 'wrap', 'centered wrap');
    dz.select(null); // إغلاق أي ورقة مفتوحة من خطوات سابقة
    var eAcc = dz.state.pieces.filter(function (x) { return x.kind === 'acc'; })[0];
    dz.select({ type: 'piece', id: eAcc.id });
    await waitFor(function () { return !sBar.hidden && sBar.querySelector('[data-sbdel]'); }, 60000);
    t('E-selbar-shows', sBar.textContent.indexOf('حذف') >= 0 && !!sBar.querySelector('[data-sbprops]') &&
      !!sBar.querySelector('[data-sbplus]') && insp.hidden, 'actions, inspector closed');
    var eCount = dz.state.pieces.filter(function (x) { return x.kind === 'acc' && x.itemId === 'acc-marka'; }).length;
    sBar.querySelector('[data-sbplus]').click();
    await waitFor(function () { return dz.state.pieces.filter(function (x) { return x.kind === 'acc' && x.itemId === 'acc-marka'; }).length === eCount + 1 && !sBar.hidden; }, 60000);
    t('E-selbar-qty', insp.hidden, 'qty+1 w/o inspector');
    var eR0 = (dz.selectedPiece() || {}).rot || 0;
    sBar.querySelector('[data-sbrot]').click();
    await waitFor(function () {
      var q = dz.selectedPiece();
      return q && q.rot === ((eR0 + 90) % 360);
    }, 60000);
    t('E-selbar-rot', true);
    var eDel = dz.selectedPiece();
    var eN = dz.state.pieces.length;
    sBar.querySelector('[data-sbdel]').click();
    await waitFor(function () { return dz.state.pieces.length === eN - 1 && sBar.hidden; }, 60000);
    t('E-selbar-del', dz.piece(eDel.id) === null && insp.hidden, 'deleted, no props gate');
    var eDoor = dz.addOpening(0, 'door');
    var eGaps = eDoor && dz.openingGaps(eDoor.id);
    var eW0 = dz.geometry().walls[0].len;
    t('E-gaps', !!(eDoor && eGaps && eGaps.left >= 0 && eGaps.right >= 0 &&
      Math.abs(eGaps.left + eDoor.w + eGaps.right - eW0) < 0.01), JSON.stringify(eGaps));
    dz.select({ type: 'opening', id: eDoor.id });
    await waitFor(function () { return !sBar.hidden && sBar.textContent.indexOf('باب') >= 0; }, 60000);
    t('E-selbar-opening', !!sBar.querySelector('[data-sbdel]'), 'opening actions');
    sBar.querySelector('[data-sbdel]').click();
    await waitFor(function () { return dz.opening(eDoor.id) === null; }, 60000);
    t('E-selbar-opening-del', sBar.hidden, 'opening deleted');
    // B: تسعير سليم مع عامود (يُتجاهل) + حفظ/إعادة فتح
    var lines = window.MajlisApp.computeLines(window.MajlisApp.order);
    var accLine = lines.lines.filter(function (l) { return l.kind === 'acc'; })[0];
    t('B-pricing', accLine && accLine.qty === 5 && Number.isFinite(lines.total) && lines.lines.every(function (l) { return l.kind !== 'column'; }), 'qty=' + (accLine && accLine.qty));
    var cnm = document.querySelector('#custName');
    cnm.value = 'عميل اختبار';
    cnm.dispatchEvent(new Event('input', { bubbles: true }));
    var cph = document.querySelector('#custPhone');
    cph.value = '0512345678';
    cph.dispatchEvent(new Event('input', { bubbles: true }));
    document.querySelector('#btnSaveOrder').click();
    await waitFor(function () { return /#\d+/.test(document.querySelector('#orderTitle').textContent); }, 240000);
    var ordNo = document.querySelector('#orderTitle').textContent;
    document.querySelector('button[data-page="orders"]').click();
    await waitFor(function () { return document.querySelector('#page-orders').classList.contains('active'); });
    await waitFor(function () { return document.querySelector('#ordersTable [data-open]'); }, 120000);
    document.querySelector('#ordersTable [data-open]').click();
    await waitFor(function () { return document.querySelector('#orderTitle').textContent === ordNo; }, 120000);
    var ro = window.MajlisApp.order;
    t('B-reload', ro.design.pieces.filter(function (x) { return x.kind === 'acc'; }).length === 5 && ro.design.pieces.some(function (x) { return x.kind === 'column'; }), 'acc+column kept');
    // H: صفحة تصاميم العملاء داخل التطبيق الحقيقي (دخول مدير فعلي عبر النموذج)
    sqlite.run("INSERT INTO customer_designs (id, public_no, token, status, design, customer_name, customer_phone, contact_requested, created_at, updated_at) VALUES " +
      "('gd-1', 26000199, 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb', 'new', '{\"walls\":[]}', 'زبون', '0550000000', 0, '2026-01-01', '2026-01-02')");
    document.querySelector('#mainNav button[data-page="designs"]').click();
    await waitFor(function () { return document.querySelector('#page-designs').classList.contains('active'); }, 60000);
    await waitFor(function () { return document.querySelectorAll('#desTable tbody tr').length === 1; }, 120000);
    t('G-ui-list', document.querySelector('#desTable tbody tr').textContent.indexOf('MJ-26000199') >= 0, 'row renders');
    t('G-ui-noerr', document.querySelector('#toast').textContent.indexOf('تعذّر جلب') < 0, 'no fetch toast');
    document.querySelector('#desTable [data-desopen]').click();
    await waitFor(function () { return !document.querySelector('#modal').hidden; }, 60000);
    t('G-ui-open', document.querySelector('#modal').textContent.indexOf('MJ-26000199') >= 0, 'viewer modal');
    document.querySelector('#modalClose').click();
    // H: وضع التعديل + تحديد الكل + حذف فردي من قائمة الإجراءات
    sqlite.run("INSERT INTO customer_designs (id, public_no, token, status, design, customer_name, customer_phone, contact_requested, created_at, updated_at) VALUES " +
      "('gd-2', 26000200, 'ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff', 'new', '{\"walls\":[]}', 'زبون٢', '0550000011', 0, '2026-01-01', '2026-01-02')");
    document.querySelector('#mainNav button[data-page="orders"]').click();
    await waitFor(function () { return document.querySelector('#page-orders').classList.contains('active'); }, 60000);
    document.querySelector('#mainNav button[data-page="designs"]').click();
    await waitFor(function () { return document.querySelectorAll('#desTable tbody tr').length === 2; }, 120000);
    t('H-row-menu', !!document.querySelector('#desTable [data-desdel]') && !!document.querySelector('#desTable [data-desconv]'), 'row actions: delete+convert');
    t('H-bulk-hidden', document.querySelector('#desBulk').hidden, 'bulk hidden by default');
    document.querySelector('#desEditBtn').click();
    await waitFor(function () { return !document.querySelector('#desBulk').hidden; }, 60000);
    t('H-edit-mode', document.querySelectorAll('#desTable tbody [data-dessel]').length === 2 &&
      !document.querySelector('#desTable tbody .c-pick').hidden, 'checkbox column visible');
    document.querySelector('#desSelAll').click();
    await waitFor(function () { return document.querySelector('#desBulkCount').textContent.indexOf('2') >= 0; }, 60000);
    t('H-select-all', !document.querySelector('#desBulkDel').disabled &&
      document.querySelectorAll('#desTable tbody [data-dessel]:checked').length === 2, document.querySelector('#desBulkCount').textContent);
    document.querySelector('#desEditOff').click();
    await waitFor(function () { return document.querySelector('#desBulk').hidden; }, 60000);
    t('H-edit-off', document.querySelectorAll('#desTable tbody [data-dessel]:checked').length === 0, 'selection cleared');
    // حذف صف واحد عبر قائمة الإجراءات + تأكيد
    document.querySelector('#desTable [data-desdel]').click();
    await waitFor(function () { var m = document.querySelector('#modal'); return m && !m.hidden && m.textContent.indexOf('حذف') >= 0; }, 60000);
    var okDel = document.querySelector('#modal .btn.danger, #modal .btn.primary');
    var rowsBefore = document.querySelectorAll('#desTable tbody tr').length;
    okDel.click();
    await waitFor(function () { return document.querySelectorAll('#desTable tbody tr').length === rowsBefore - 1; }, 120000);
    t('H-row-delete', document.querySelectorAll('#desTable tbody tr').length === 1, 'row removed');
    // N: ضمان عدم إصابة واجهة الموظفين/المندوب بالمشكلتين نفسهما
    // N1: اختيار الجدار من قائمة «الجدار» ثم «باب» ينفّذ على ذلك الجدار بلا لمس المخطط
    document.querySelector('#mainNav button[data-page="order"]').click();
    await waitFor(function () { return document.querySelector('#page-order').classList.contains('active'); }, 60000);
    dz.select(null);
    await waitFor(function () { return !document.querySelector('#inspector').hidden === false; }, 60000);
    var wsel = document.querySelector('#wallSel');
    var nWalls = dz.state.walls.length;
    wsel.value = String(nWalls - 1);   // آخر جدار
    wsel.dispatchEvent(new Event('change', { bubbles: true }));
    var wantWall = Number(wsel.value);
    document.querySelector('#tbAddDoor').click();
    await waitFor(function () { return dz.state.openings.some(function (o) { return o.type === 'door' && o.wall === wantWall; }); }, 60000);
    t('N1-staff-wall-picker', dz.state.openings.some(function (o) { return o.type === 'door' && o.wall === wantWall; }),
      'wall=' + wantWall + ' openings=' + dz.state.openings.map(function (o) { return o.wall; }).join(','));
    // N2: لمسة واحدة تُظهر الخصائص، والاستمرار بالسحب يُخفيها (المخطط يبقى ظاهراً)
    dz.select(null);
    // في العرض الجانبي (سطح المكتب) تفتح اللوحة بالنقر تلقائياً؛ على الجوال تفتح بزر «الخصائص»
    var nPiece = dz.state.pieces.filter(function (x) { return x.kind === 'acc'; })[0];
    dz.select({ type: 'piece', id: nPiece.id });
    var nIns = document.querySelector('#inspector');
    if (nIns.hidden) document.querySelector('#tbEdit').click();
    await waitFor(function () { return !document.querySelector('#inspector').hidden; }, 60000);
    t('N2-sheet-on-select', !document.querySelector('#inspector').hidden, 'inspector opens on tap');
    // في واجهة الموظفين لا تُغطّي الخصائصُ المخططَ في العرض الجانبي (سطح المكتب ≥961px)،
    // وعلى الجوال تُغلق تلقائياً عند السحب. نتحقق من عدم تغطية المخطط في الحالة الحاضرة.
    cv2.scrollIntoView({ block: 'center' });
    await new Promise(function (r) { setTimeout(r, 100); });
    rect = cv2.getBoundingClientRect();
    var nIsMobile = window.matchMedia('(max-width: 960px)').matches;
    if (nIsMobile) {
      // ورقة سفلية: تُغلق فوراً عند بدء السحب باللمس (كما في السلوك المقصود)
      var nSel2 = dz.selectedPiece();
      var nBody = (function () { var r2 = cv2.getBoundingClientRect(); var s2 = dz.toScreen(nSel2.x, nSel2.y); return { x: s2.x, y: s2.y, r: r2 }; })();
      var nPe2 = function (type, cx, cy) {
        return new PointerEvent(type, { bubbles: true, cancelable: true, clientX: nBody.r.left + cx, clientY: nBody.r.top + cy, button: 0, pointerId: 21, pointerType: 'touch', isPrimary: true });
      };
      dz.select({ type: 'piece', id: nSel2.id });
      if (document.querySelector('#inspector').hidden) document.querySelector('#tbEdit').click();
      await waitFor(function () { return !document.querySelector('#inspector').hidden; }, 60000);
      dz.canvas.dispatchEvent(nPe2('pointerdown', nBody.x, nBody.y));
      dz.canvas.dispatchEvent(nPe2('pointermove', nBody.x + 28, nBody.y + 18));
      dz.canvas.dispatchEvent(nPe2('pointerup', nBody.x + 28, nBody.y + 18));
      await waitFor(function () { return document.querySelector('#inspector').hidden; }, 60000);
      t('N2-sheet-hides-on-touch-drag', document.querySelector('#inspector').hidden, 'sheet hides on touch drag (mobile)');
    } else {
      var nCoverDesk = document.elementsFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2)
        .some(function (el) { return el.id === 'inspector' && !el.hidden; });
      t('N2-side-panel-desktop', !nCoverDesk, 'desktop side panel, no cover');
    }
    // B: مسح تجاوز أفقي (صفحة الطلب)
    var badEls = [];
    document.querySelectorAll('#app button, #app input, #app select, #app table, #app .card, #app .module, #app header').forEach(function (el) {
      if (el.closest('.table-wrap')) return;
      var cs = getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden') return;
      var r = el.getBoundingClientRect();
      if (r.width === 0) return;
      if (r.right > window.innerWidth + 1 || r.left < -1) badEls.push((el.id || el.className.toString().slice(0, 20) || el.tagName));
    });
    t('B-overflow', document.documentElement.scrollWidth <= window.innerWidth + 1 && badEls.length === 0, badEls.slice(0, 3).join('|'));
    window.fetch = realFetch;
  }

  (async function run() {
    try { await partA(); }
    catch (e) { bad++; log('FAIL partA :: ' + e.message); }
    try { await partB(); }
    catch (e) { bad++; log('FAIL partB :: ' + (e.message || e)); }
    finally {
      try { window.fetch = realFetch; } catch (_) { /* noop */ }
      if (window.TEST_ERRORS.length) { bad++; log('WINDOW ERRORS: ' + window.TEST_ERRORS.join(' | ')); }
      var verdict = bad === 0 ? ('PASS ' + n + '/' + n) : 'FAIL';
      document.getElementById('testResult').textContent = verdict;
      document.title = verdict;
      log('---- ' + verdict + ' ----');
    }
  })();
})();
</script>
